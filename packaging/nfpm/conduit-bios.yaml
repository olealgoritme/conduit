# nfpm config for `conduit-bios`: the Conduit BIOS firmware images (edk2 OVMF
# with the Conduit boot logo, packaging/bios). Rendered by packaging/build.sh
# `package bios-deb`; @BIOS@ is packaging/bios/build.sh's output directory.
# Only a .deb (and the tarball): the images match Debian/Ubuntu's ovmf, and
# `conduit attach` only swaps the loaders of that package (cli/src/bios.rs),
# so an .rpm or Arch package would install firmware nothing uses. Versioned by the edk2 build (packaging/bios/version.sh),
# not by Conduit releases, so it only changes when the firmware does.
name: conduit-bios
arch: all
platform: linux
version: "@BIOS_VERSION@"
version_schema: none
release: "1"
section: misc
priority: optional
maintainer: "Ole Algoritme <olealgoritme@gmail.com>"
description: |
  Conduit BIOS: UEFI firmware for Conduit VMs.
  Ubuntu's edk2 OVMF firmware rebuilt with the same flags, with the Conduit
  boot logo and the firmware display started in the VM's native mode.
  `conduit attach` uses it for VMs on the matching stock 4 MB OVMF image and
  keeps their NVRAM vars file.
vendor: Conduit
homepage: https://github.com/olealgoritme/conduit
license: BSD-2-Clause-Patent AND Apache-2.0 AND MIT

contents:
  - src: "@BIOS@/conduit-bios.fd"
    dst: /usr/share/conduit/bios/conduit-bios.fd
  - src: "@BIOS@/conduit-bios.secboot.fd"
    dst: /usr/share/conduit/bios/conduit-bios.secboot.fd
  - src: "@BIOS@/VERSION"
    dst: /usr/share/conduit/bios/VERSION
  - src: "@BIOS@/OVMF_VERSION"
    dst: /usr/share/conduit/bios/OVMF_VERSION
  - src: "@BIOS@/copyright"
    dst: /usr/share/doc/conduit-bios/copyright
  # Firmware descriptors, so libvirt accepts the images for firmware='efi'
  # VMs. Priority 90: automatic firmware selection keeps preferring the stock
  # images (lower numbers). They name Debian/Ubuntu's vars templates.
  - src: "@ROOT@/packaging/bios/firmware/90-conduit-bios.json"
    dst: /usr/share/qemu/firmware/90-conduit-bios.json
  - src: "@ROOT@/packaging/bios/firmware/90-conduit-bios-secboot.json"
    dst: /usr/share/qemu/firmware/90-conduit-bios-secboot.json
  - src: "@ROOT@/packaging/bios/firmware/90-conduit-bios-secboot-enrolled.json"
    dst: /usr/share/qemu/firmware/90-conduit-bios-secboot-enrolled.json

# Removing the package lists the VMs that still boot from it (they would not
# boot any more) and how to switch them back.
scripts:
  preremove: "@ROOT@/packaging/bios/vms-using-bios"

overrides:
  deb:
    depends: [ovmf]

deb:
  compression: zstd
