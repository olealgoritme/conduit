# DKMS configuration for the Conduit guest kernel module (virtio_gpu_nv).
# packaging/build.sh guest-src fills in @VERSION@ and copies this file next to
# the module sources in /usr/src/conduit-guest-<version>/.
PACKAGE_NAME="conduit-guest"
PACKAGE_VERSION="@VERSION@"

BUILT_MODULE_NAME[0]="virtio_gpu_nv"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Build through Kbuild directly, so DKMS does not depend on the Makefile's
# convenience targets. CONFIG_VIRTIO_GPU_NV=m selects the module (obj-$(...)).
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_VIRTIO_GPU_NV=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# The module needs Linux 6.4 or newer. The regex works on every DKMS version
# (BUILD_EXCLUSIVE_KERNEL_MIN only exists in DKMS >= 3.1): 6.4..6.x, 7..99.
BUILD_EXCLUSIVE_KERNEL="^(6\.([4-9]|[1-9][0-9]+)|[7-9]|[1-9][0-9]+)\."

AUTOINSTALL="yes"
