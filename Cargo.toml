[workspace]
resolver = "2"
members = ["cli"]
exclude = ["host/backend", "host/vmm", "host/venus", "guest/windows"]

[workspace.package]
version = "0.1.5"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/olealgoritme/conduit"

[profile.release]
lto = true
codegen-units = 1
strip = true
