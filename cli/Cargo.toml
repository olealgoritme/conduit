[package]
name = "conduit"
description = "Share your NVIDIA GPU with a Linux VM and see its desktop in a window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "conduit"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmltree = { version = "0.11", features = ["attribute-order"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# use-dev-tty: crossterm's poll(2) input source. Its default (mio) source
# rereads a hung-up terminal forever inside one `event::poll` call (read
# errors other than WouldBlock and EOF are retried at once, still so in
# 0.29), so a closed terminal window left `conduit setup` spinning.
crossterm = { version = "0.28", features = ["use-dev-tty"] }
# The one parser of the driver version text, and the release type.
abi = { path = "../host/backend/gen" }
# The backend's trace format, for `conduit trace` (docs/TRACING.md).
conduit-trace = { path = "../host/backend/trace" }
