[package]
name = "conduit-stream"
description = "Stream a Conduit VM to Moonlight clients and Conduit viewers (NVENC)"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/olealgoritme/conduit"
build = "build.rs"

# Its own workspace: built and tested on its own (CI job "stream").
[workspace]

[[bin]]
name = "conduit-stream"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
libc = "0.2"
log = "0.4"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
