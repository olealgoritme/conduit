# Builds the Windows guest stack (WDDM driver, D3D11/12 UMDs, Mesa Venus ICD,
# loaders, installer) from guest/windows with windows-build.yml. Artifacts:
# the installable package per configuration, and the Release driver zip for
# the GitHub release.
name: Windows guest driver (Venus)

# Runs on v* tags (the release attaches conduit-windows-gpu-driver-<version>.zip)
# and by hand (Actions > Run workflow, or `gh workflow run windows.yml`): the
# whole bundle, about an hour on Windows runners.
#
# On pull requests that touch the guest, only what the change can break, and
# nothing is signed or uploaded to a release:
#   guest/nvk-rm, guest/rmclient       NVK on RM and Zink (MinGW cross build)
#   guest/windows, these workflows     that, then the WDDM driver and UMDs
#                                      (Release and Debug)
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - guest/nvk-rm/**
      - guest/rmclient/**
      - guest/windows/**
      - .github/workflows/windows.yml
      - .github/workflows/windows-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-guest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What a pull request changes: the driver build runs when guest/windows or
  # the workflows do (an NVK-only change cannot break it). Tags and manual
  # runs build everything.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      driver: ${{ steps.scope.outputs.driver }}
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # the merge commit and its first parent, the base
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "driver=true" >> "$GITHUB_OUTPUT"
            echo "package=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE '^(guest/windows/|\.github/workflows/windows(-build)?\.yml$)'; then
            echo "driver=true" >> "$GITHUB_OUTPUT"
          else
            echo "driver=false" >> "$GITHUB_OUTPUT"
          fi
          echo "package=false" >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    uses: ./.github/workflows/windows-build.yml
    with:
      driver: ${{ needs.scope.outputs.driver == 'true' }}
      package: ${{ needs.scope.outputs.package == 'true' }}

  # On a v* tag, attach the driver zip and the full Release package
  # (HeliosSetup.exe, as conduit-windows-gpu-setup-<version>.zip) to the
  # GitHub release that release.yml creates from the same tag (it publishes
  # after the Linux packages are built, QEMU included on a cache miss, so wait
  # for it), with their checksums in their own SHA256SUMS-windows:
  # release.yml's SHA256SUMS stays as that workflow wrote it, whichever of the
  # two finishes last.
  release:
    name: Attach the driver zip and the setup package to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: conduit-windows-gpu-driver
          path: zip
      - uses: actions/download-artifact@v8
        with:
          pattern: helios-windows-x64-*-Release
          path: setup
          merge-multiple: true
      - name: Wait for the release
        run: |
          # release.yml creates the release in its last job, with SHA256SUMS.
          for _ in $(seq 180); do
            if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx SHA256SUMS; then
              exit 0
            fi
            sleep 60
          done
          echo "::error::Release $TAG did not appear within 3 hours; check the release workflow, then re-run this job."
          exit 1
      - name: Upload the zips and SHA256SUMS-windows
        run: |
          zip=$(ls zip/conduit-windows-gpu-driver-*.zip)
          name=$(basename "$zip")
          version=${name#conduit-windows-gpu-driver-}
          version=${version%.zip}
          pkgs=()
          for f in setup/helios-windows-x64-*.zip; do
            case "$f" in *-symbols.zip) ;; *) pkgs+=("$f") ;; esac
          done
          [ "${#pkgs[@]}" = 1 ] || { echo "::error::expected one setup package, got: ${pkgs[*]}"; exit 1; }
          pkg=${pkgs[0]}
          setup="conduit-windows-gpu-setup-$version.zip"
          cp "$pkg" "zip/$setup"
          (cd zip && sha256sum "$name" "$setup") > SHA256SUMS-windows
          gh release upload "$TAG" "$zip" "zip/$setup" SHA256SUMS-windows --clobber
          cat SHA256SUMS-windows
