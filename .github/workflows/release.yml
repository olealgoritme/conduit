# Release: on a v* tag, build every artifact in docs/STRUCTURE.md and attach
# them to a GitHub Release. All builds go through packaging/build.sh.
#
#   rust-static  backend, VMM and CLI as static musl binaries, built once and
#                shared by every package (they have no runtime dependencies)
#   host         per-format container: viewer, stream host, Venus renderer
#                (conduit-venus + its virglrenderer, from the host/venus
#                submodules) and bundled QEMU 11.1 (cached), staged and
#                packaged with nfpm (deb/rpm/Arch) or as a tarball with its
#                libraries bundled (Debian 12, the oldest glibc we build on)
#   guest        conduit-guest DKMS source packages (.deb, .rpm, Arch)
#   bios         conduit-bios firmware packages (bios.yml, cached)
#   release      checksums, AUR PKGBUILD, GitHub Release
#
# workflow_dispatch builds everything without publishing (artifacts only).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # build.sh strips the leading "v". Manual runs get a dev version.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.0-dev.{0}', github.run_number) }}
  NFPM_VERSION: "2.43.0"

jobs:
  rust-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml, incl. the musl target)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            host/backend
            host/vmm
      - name: Build static binaries
        run: RUST_TARGET=x86_64-unknown-linux-musl packaging/build.sh rust
      - uses: actions/upload-artifact@v4
        with:
          name: rust-static
          path: dist/rust/bin/
          if-no-files-found: error

  host:
    name: host (${{ matrix.format }})
    needs: rust-static
    # The Fedora rpm build can't find venus-protocol yet; don't let it block the release.
    continue-on-error: ${{ matrix.format == 'rpm' }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            image: mirror.gcr.io/library/ubuntu:24.04
          - format: rpm
            image: mirror.gcr.io/library/fedora:latest
          - format: archlinux
            image: mirror.gcr.io/library/archlinux:latest
          - format: tarball
            image: mirror.gcr.io/library/debian:12
    steps:
      - name: Tools the checkout and cache actions need
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar zstd
          elif command -v dnf >/dev/null; then
            dnf install -y git curl tar zstd
          else
            pacman -Syu --noconfirm --needed git curl tar zstd
          fi
      - uses: actions/checkout@v5
      - name: Mark the workspace safe for git (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Only the two submodules `build.sh venus` builds (virglrenderer, with
      # host/venus/patches applied, and venus-protocol); the Windows guest's
      # (Mesa, DXVK, vkd3d-proton) are not needed for the host packages.
      - name: Venus submodules
        run: git submodule update --init host/venus/third_party/virglrenderer host/venus/third_party/venus-protocol

      - name: Build dependencies
        run: packaging/build.sh deps

      - uses: actions/download-artifact@v5
        with:
          name: rust-static
          path: dist/rust/bin
      - name: Restore executable bits (artifacts drop them)
        run: chmod 0755 dist/rust/bin/*

      # QEMU takes most of the build time. Cache it per format, per week
      # (rolling images like fedora:latest and archlinux change library
      # sonames), and per change to the QEMU sources/patches or to
      # packaging/build.sh (prefix, install step, PREFIX/JOBS defaults).
      - name: Cache key
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache QEMU
        id: qemu-cache
        uses: actions/cache@v4
        with:
          path: dist/qemu-root
          key: qemu-11.1-${{ matrix.format }}-${{ steps.week.outputs.week }}-${{ hashFiles('host/qemu/**', 'packaging/build.sh') }}
      - name: Build QEMU 11.1
        if: steps.qemu-cache.outputs.cache-hit != 'true'
        run: packaging/build.sh qemu

      - name: Build viewer
        run: packaging/build.sh viewer

      # conduit-stream links the distro's glibc/EGL/GBM/OpenSSL, so it is
      # built here in the distro container; rustup reads rust-toolchain.toml.
      - name: Rust toolchain for the stream host
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build stream host
        run: packaging/build.sh stream

      # conduit-venus (`--venus`, Windows guests) links the distro's glibc and
      # Vulkan loader, so it is built here too, with its own virglrenderer.
      - name: Build Venus renderer
        run: packaging/build.sh venus

      # Before Stage: stage builds the guest packages (deb, rpm, Arch) that
      # attach ships, and skips them without nfpm.
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin nfpm

      - name: Stage
        run: |
          if [ "${{ matrix.format }}" = tarball ]; then
            # Tarball installs link /usr/local/bin/conduit and carry their libraries.
            LINK_DIR=/usr/local/bin packaging/build.sh stage
            packaging/build.sh bundle-libs
          else
            packaging/build.sh stage
          fi

      - name: Package
        run: packaging/build.sh package "${{ matrix.format }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.format }}
          path: dist/out/*
          if-no-files-found: error

  guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install nfpm
        run: |
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
      - name: Package
        run: |
          packaging/build.sh package guest-deb
          packaging/build.sh package guest-rpm
          packaging/build.sh package guest-arch
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-guest
          path: dist/out/*
          if-no-files-found: error

  bios:
    uses: ./.github/workflows/bios.yml
    # bios.yml's mirror job publishes the edk2 sources as a release asset.
    permissions:
      contents: write

  release:
    needs: [host, guest, bios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: pkg-*
          path: out
          merge-multiple: true
      - name: AUR PKGBUILD and checksums
        run: |
          v="${VERSION#v}"
          # pacman versions cannot contain "-": 0.2.0-rc1 -> 0.2.0rc1
          sed -e "s/^pkgver=.*/pkgver=${v//-/}/" -e "s/#tag=v\$pkgver/#tag=v$v/" \
            packaging/arch/PKGBUILD > out/PKGBUILD
          cp packaging/arch/conduit.install out/
          (cd out && sha256sum -- * > SHA256SUMS)
          ls -l out
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
