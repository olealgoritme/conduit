# CI: every push and pull request.
#
#   rust          fmt, clippy and tests for each Rust project (backend, VMM, venus, CLI)
#   guest-module  the guest kernel module against Ubuntu 24.04 (GA 6.8 and HWE),
#                 Debian 13 (6.12) and Fedora (newest) headers
#   viewer        the C viewer's own test suite (`make check`, no display needed)
#   stream        conduit-stream (network streaming): fmt, clippy, tests
#   guest-agent   the guest clipboard agent's unit tests (Python, Xvfb)
#   packaging     shellcheck the packaging scripts, check the venus submodule pins
#                 in flake.nix and the RPM spec, build the DKMS source package
#
# Nothing here needs an NVIDIA GPU. Tests that open /dev/nvidiactl are skipped
# by name (the --skip filters in the rust job); they run on the developer rig instead.
name: ci

on:
  push:
    branches: [master, main]
  # Every pull request, generated-table-only ones (the weekly ABI PR) too:
  # the jobs here are the required checks, and a skipped workflow never
  # reports them.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: host/backend
            # The vhost-user transport and the Venus path are feature-gated;
            # lint and test them too (Venus needs no virglrenderer here).
            features: "--workspace --features device/vhost-user,device/venus"
          - name: vmm
            dir: host/vmm
            # Built without default features (no virglrenderer), as shipped.
            features: "--workspace --no-default-features"
          - name: venus
            dir: host/venus
            # Default features only: the `renderer` feature (the conduit-venus
            # binary) links a locally built virglrenderer, so it is not built here.
            features: ""
          - name: cli
            # cli/ is a member of the workspace at the repo root.
            dir: "."
            features: "--workspace"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v5
      # rustup is on the runner; the first cargo call installs the toolchain
      # pinned in rust-toolchain.toml (with rustfmt and clippy).
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.dir }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        # Our own code (cli) is held to zero warnings. The imported components
        # keep upstream's style; there only correctness/suspicious lints fail.
        run: cargo clippy --locked --all-targets ${{ matrix.features }} -- ${{ matrix.name == 'cli' && '-D warnings' || '-D clippy::correctness -D clippy::suspicious -D unused_must_use' }}
      - name: test
        # The skipped tests open /dev/nvidiactl and map GPU memory.
        run: >-
          cargo test --locked ${{ matrix.features }} --
          --skip for_real --skip closing_the_fd --skip repeated_map_unmap

  guest-module:
    name: guest module (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest kernels exercise nvgpu_compat.h's fallbacks (own
          # vblank timer, no format info in fb_create, old virtio_find_vqs).
          - distro: ubuntu-24.04
            image: mirror.gcr.io/library/ubuntu:24.04
            headers: linux-headers-generic
          - distro: ubuntu-24.04-hwe
            image: mirror.gcr.io/library/ubuntu:24.04
            headers: linux-headers-generic-hwe-24.04
          - distro: debian-13
            image: mirror.gcr.io/library/debian:13
            headers: linux-headers-amd64
          - distro: fedora-latest
            image: mirror.gcr.io/library/fedora:latest
            headers: kernel-devel
    steps:
      - name: Install kernel headers and compiler
        run: |
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ${{ matrix.headers }} make gcc libc6-dev git ca-certificates
          else
            dnf install -y ${{ matrix.headers }} make gcc elfutils-libelf-devel git libasan libubsan
          fi
      - uses: actions/checkout@v5
      - name: Find the header tree and its compiler
        run: |
          # Containers have no running kernel of their own: build against the
          # newest installed header tree, with the GCC major it was built with
          # (a mismatched GCC can reject the tree's flags).
          KDIR=$(for d in /usr/src/linux-headers-*-generic /usr/src/linux-headers-*-amd64 /usr/src/kernels/*; do
                   [ -f "$d/Makefile" ] && echo "$d"; done | sort -V | tail -1)
          test -n "$KDIR" || { echo "no kernel headers found"; exit 1; }
          GCCVER=$(sed -n 's/^CONFIG_GCC_VERSION=\([0-9]*\)$/\1/p' "$KDIR/.config")
          CC=gcc
          if [ -n "$GCCVER" ] && [ "$(gcc -dumpversion | cut -d. -f1)" != "$((GCCVER / 10000))" ]; then
            CC=gcc-$((GCCVER / 10000))
            command -v apt-get >/dev/null && apt-get install -y --no-install-recommends "$CC"
          fi
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"
          echo "KCC=$CC" >> "$GITHUB_ENV"
          echo "Building against $KDIR with $CC"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make -C guest/linux KDIR="$KDIR" CC="$KCC" module 2>&1 | tee build.log
          # Zero compiler warnings on every kernel. (Kbuild's own notes about
          # the compiler or pahole differing are not file:line diagnostics.)
          if grep -E '^[^ :]+:[0-9]+:([0-9]+:)? warning:' build.log; then
            echo "::error::compiler warnings in the guest module"; exit 1
          fi
      - name: Check the module
        run: |
          ko=guest/linux/conduit_gpu.ko
          test -f "$ko"
          # modinfo is not always installed; the .modinfo section is enough.
          objcopy -O binary --only-section=.modinfo "$ko" modinfo.bin
          tr '\0' '\n' < modinfo.bin | grep -E '^(license|vermagic|alias)='
          tr '\0' '\n' < modinfo.bin | grep -qx 'name=conduit_gpu'
      - name: Unit tests (plain-C parts, on the build host)
        run: make -C guest/linux HOSTCC="$KCC" check

  viewer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev wayland-protocols libxcb1-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-render0-dev libxcb-xinput-dev libgbm-dev python3
      - name: make check
        run: make -C host/viewer -j"$(nproc)" check

  stream:
    # conduit-stream (host/stream): fmt, clippy (zero warnings) and tests.
    # The tests cover the protocol side (pairing crypto, RTSP/control
    # encryption, video packets + Reed-Solomon recovery, input translation,
    # the broker socket); NVENC/NVDEC need a GPU and run on the developer rig.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: host/stream
    steps:
      - uses: actions/checkout@v5
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev libegl-dev libgl-dev libgbm-dev pkg-config
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: host/stream
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked

  guest-agent:
    # conduit-clipboard-agent: record format, echo suppression, backend
    # choice, device loss, and the X11 backend against Xvfb (INCR included).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xclip libxfixes3 python3
      - name: unittest
        working-directory: guest/agent
        run: python3 -m unittest -v test_agent test_ctl_agent

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # build.sh derives the version from tags
      - name: actionlint
        # A pinned release, checked against its published SHA-256.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: |
          shellcheck -S warning \
            packaging/build.sh packaging/supported-drivers.sh packaging/common/conduit-integrate \
            packaging/tarball/*.sh packaging/deb/*/* \
            guest/system/conduit-guest-setup cli/assets/build-disk.sh \
            packaging/common/icons.sh packaging/test/icons.sh \
            packaging/bios/build.sh packaging/bios/install.sh
      - name: App icon set
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate packaging/common/conduit.desktop
          packaging/test/icons.sh
      # The RPM spec and the flake fetch the venus submodules themselves
      # (git archive and flake sources leave submodules out).
      - name: Venus submodule pins in flake.nix and conduit.spec
        run: |
          for sub in virglrenderer venus-protocol; do
            rev=$(git ls-tree HEAD "host/venus/third_party/$sub" | awk '{print $3}')
            for f in flake.nix packaging/rpm/conduit.spec; do
              grep -q "$rev" "$f" || { echo "::error file=$f::$sub is pinned at $rev, not in $f"; exit 1; }
            done
          done
      - name: DKMS source package
        run: |
          NFPM_VERSION=2.43.0
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          packaging/build.sh package guest-deb
          dpkg-deb -c dist/out/conduit-guest_*_all.deb
          dpkg-deb -c dist/out/conduit-guest_*_all.deb | grep usr/bin/conduit-clipboard-agent
          dpkg-deb -c dist/out/conduit-guest_*_all.deb | grep usr/bin/conduit-ctl-agent
          dpkg-deb -c dist/out/conduit-guest_*_all.deb | grep usr/lib/udev/rules.d/70-conduit-ctl.rules
          dpkg-deb -c dist/out/conduit-guest_*_all.deb | grep usr/lib/conduit-guest/setup
          dpkg-deb -c dist/out/conduit-guest_*_all.deb | grep 'usr/src/conduit-guest-.*/conduit_gpu\.c'
          packaging/build.sh package guest-arch
          tar -I zstd -tf dist/out/conduit-guest-*-any.pkg.tar.zst | grep -x usr/bin/conduit-clipboard-agent
          tar -I zstd -tf dist/out/conduit-guest-*-any.pkg.tar.zst | grep -x usr/bin/conduit-ctl-agent
          tar -I zstd -tf dist/out/conduit-guest-*-any.pkg.tar.zst | grep -x '\.INSTALL'
          tar -I zstd -tf dist/out/conduit-guest-*-any.pkg.tar.zst | grep 'usr/src/conduit-guest-.*/conduit_gpu\.c'
