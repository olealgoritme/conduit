# Descriptions of the Windows guest knobs for docs/WINDOWS-KNOBS.md.
#
# Only the human part lives here. Names, types, defaults and source lines are
# read from the code by gen-windows-knobs.py, which fails (in CI too) when a
# knob in code has no entry here or an entry names a knob the code no longer
# reads. After editing, run: python3 guest/windows/tools/gen-windows-knobs.py
#
#   [SECTION.Name]   kmd = KMD service key, umd = HKLM\SOFTWARE\Helios, env = environment
#   class        supported | tuning | debug | experiment | state
#   read         when the value is read
#   effect       what it does, one or two sentences, current behaviour only
#   default_note optional: what a computed or symbolic default means
#   see          optional: a markdown link relative to docs/

# --- KMD service key (HKLM\SYSTEM\CurrentControlSet\Services\helios_kmd_render) ---

[kmd.AllocCached]
class = "debug"
read = "AddAdapter and StartDevice"
effect = "1 makes CPU-visible allocations cached; 0 is the kill switch that makes them uncached."

[kmd.BarSegBaseMB]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "BaseAddress of the BAR memory segment descriptor, in MiB."
see = "[SCANOUT.md](SCANOUT.md)"

[kmd.BarSegFlags]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "Flag word of the BAR memory segment descriptor reported to VidMm."

[kmd.BarSegMode]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "Segment topology reported to VidMm. Only 0 and 10 are legal (`BarSegTopology`)."

[kmd.BindFlushMode]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "When the bind edge tells the host to read a freshly bound primary: 0 orders it after the buffer's own present marker; 1 flushes at once with no ordering (an A/B probe, not a mode to run)."

[kmd.BltAsync]
class = "tuning"
read = "StartDevice"
effect = "1: a Blt Present of an adopted foreign (NVK-on-RM) source into a KMD standard buffer returns without a CPU wait; the copy is submitted by the DDI or queued for the HPD worker and the Present's fence retires with it. 0: the DDI waits for the copy."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.BltAsyncVenus]
class = "experiment"
read = "StartDevice"
effect = "1: `BltAsync` and `BltNoMirror` also act on Venus-native sources. No effect while both are 0."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.BltLookahead]
class = "tuning"
read = "StartDevice"
effect = "How many entries of the windowed-Blt ready queue the HPD worker looks at when it picks the next copy, so a request that is not ready does not hold unrelated destinations behind it (per-destination order is kept). Clamped to 1..8."

[kmd.BltNoMirror]
class = "experiment"
read = "StartDevice"
effect = "1: such a Blt does not CPU-copy the frame into the destination's system-memory backing; the backing is marked invalid instead. Independent of `BltAsync`."

[kmd.CeRtDirect]
class = "experiment"
read = "StartDevice (with RmCopyEngine 1)"
effect = "1 submits a routed copy-engine copy at its Present (a GPU acquire waits for the producer) instead of when the HPD worker sees the producer's boundary ready."
see = "[rm-copy-engine-present.md](../guest/windows/docs/rm-copy-engine-present.md)"

[kmd.CeShadowEvery]
class = "debug"
read = "StartDevice (with RmCopyEngine 3)"
effect = "Shadow mode of the copy-engine channel: one in how many Presents is copied again by the channel and compared with the production copy."
default_note = "0 means every 64th"
see = "[rm-copy-engine-present.md](../guest/windows/docs/rm-copy-engine-present.md)"

[kmd.CopyQueue]
class = "experiment"
read = "StartDevice (device creation)"
effect = "1: the KMD's Venus device also gets a transfer-only queue and the windowed Present copies that can run there go to it; 2: as 1, and the graphics queue at high global priority. 0: one queue."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.CrossAdaptCaps]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "1 advertises `DXGK_VIDMMCAPS.CrossAdapterResource`."

[kmd.D3d12Node]
class = "experiment"
read = "AddAdapter (kept until the adapter restarts)"
effect = "1 reports a second 3D node for the D3D12 UMD's contexts (`Umd12ContextNode`), completed independently of node 0 (DWM, D3D11, presents, paging)."

[kmd.DeferBudget]
class = "debug"
read = "StartDevice"
effect = "Most Deferred programming attempts of one primary (about one per vsync tick) before the worker publishes the flip's address as kept and stops retrying. 0 = unlimited; nonzero is clamped to 16..4000000."

[kmd.DiagLevel]
class = "debug"
read = "first use after the driver image loads (reboot)"
effect = "Breadcrumb ring level: nonzero writes the `S<n>` step values into the service key. 0 = off."
see = "[TRACING.md](TRACING.md)"

[kmd.DirectFlipCaps]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "1 advertises `SupportDirectFlip` on its own. `IndepFlip` already ORs it in when on."
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[kmd.DispatchBind]
class = "tuning"
read = "AddAdapter and StartDevice"
effect = "1 also enqueues a flip's `SET_SCANOUT_BLOB` from the DISPATCH-level flip arm, ahead of the display worker; 0 leaves it to the worker only."

[kmd.DisplayHalf]
class = "debug"
read = "AddAdapter and StartDevice"
effect = "1 is the render+display miniport (the product). 0 reports the render-only adapter surface."

[kmd.DmaGpuFence]
class = "tuning"
read = "transport init (StartDevice)"
effect = "1 retires ordinary WDDM DMA fences when the host GPU completes the work; 0 retires them when the host decodes it."

[kmd.EscWaitMs]
class = "debug"
read = "StartDevice"
effect = "The longest one escape may wait in total before every wait in it fails cleanly. 0 = no deadline (kill and stop exits stay on); nonzero is clamped to 250..600000."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.FfAsyncWin]
class = "tuning"
read = "transport generation (StartDevice), with ForeignFlip on"
effect = "How many `ForeignFlip` host flips may be in flight unanswered (1 to 4): the flip is submitted on the control queue without waiting for its reply and the worker settles answers later. 0 makes every host flip a synchronous round trip."
default_note = "2 when FlipAnnounce is on (its default), else 0; not read while ForeignFlip is 0"
see = "[kmd-rm-client.md](../guest/windows/docs/kmd-rm-client.md)"

[kmd.FfRepeatMs]
class = "tuning"
read = "transport generation (StartDevice), with ForeignFlip on"
effect = "Least time between two `ForeignFlip` host flips that only repeat the picture already shown (a desktop refresh edge). 0 flips on every edge; at most 10000."

[kmd.FlGSyncMs]
class = "debug"
read = "transport init (StartDevice)"
effect = "A flush-gate Render waits up to this many ms until the boundary its packet carries has retired, so the runtime's keyed-mutex release follows GPU completion. 0 = off. Check `FlGSyncWt` to see whether it ran."
see = "[flush-gate.md](../guest/windows/docs/flush-gate.md)"

[kmd.FlipAnnForeign]
class = "tuning"
read = "StartDevice"
effect = "With `FlipAnnounce` 2, also announce flips of foreign or hollow allocations (an NVK DWM's swap chain). 0 announces Venus allocations only."
default_note = "1 when ForeignFlip is on, else 0; an explicit value wins"
see = "[kmd-rm-client.md](../guest/windows/docs/kmd-rm-client.md)"

[kmd.FlipAnnounce]
class = "tuning"
read = "StartDevice"
effect = "Publish a flip's address to dxgkrnl at `SetVidPnSourceAddress` so the next vsync retires it, while the worker programs it afterwards: 1 = only flips `ForeignFlip` accepted, 2 = every flip, 0 = off. Nonzero also wakes the worker early."
see = "[kmd-rm-client.md](../guest/windows/docs/kmd-rm-client.md)"

[kmd.FlipBusyFly]
class = "tuning"
read = "transport generation (StartDevice)"
effect = "How many pipelined `ForeignFlip` host flips may be in flight while the worker still counts as idle for `FlipAnnounce` (0 = strict, at most 4). Above 0 trades a possible tear for throughput."

[kmd.FlipCapsX]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "Extra `DXGK_FLIPCAPS` bits ORed into the driver's own word; only 0x10 (FlipIndependent), 0x20 (DdiPresentForIFlip) and 0x40 (FlipImmediateOnHSync) are accepted."

[kmd.FlipDoneHost]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "Nonzero retires flips from the host's presentation feedback: 1 holds a programmed address back until the host reports it on screen and delivers vsync from that report; 2 only holds. Also makes 2 the default `FlipQueueN`."
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[kmd.FlipEarlyWake]
class = "tuning"
read = "StartDevice"
effect = "1 asks for the device DPC that wakes the HPD worker the moment a flip is pending, instead of at the next vsync tick."

[kmd.FlipLat]
class = "debug"
read = "StartDevice"
effect = "1 collects the flip retire latency, inter-flip interval and vblank use statistics (`FlipLat*`, `IfGap*`, `VsLate*`); 0 = off."
see = "[TRACING.md](TRACING.md)"

[kmd.FlipPendWdMs]
class = "debug"
read = "StartDevice"
effect = "Generic pending-flip watchdog: the newest unfinished flip, followed by no published address for this many ms, is published as a kept picture by the vsync tick. 0 = off; nonzero is clamped to 100..60000."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.FlipQueueN]
class = "tuning"
read = "AddAdapter (restart-device applies)"
effect = "`DXGK_DRIVERCAPS.MaxQueuedFlipOnVSync`: how many flips dxgkrnl may keep queued on the adapter. 0 is taken as 1; at most 16."
default_note = "2 when FlipDoneHost is on, else 1"

[kmd.FlipWdogMs]
class = "debug"
read = "StartDevice"
effect = "Opt-in flip watchdog: a pending programming with no address published for this many ms is published as a kept picture, and the Venus direct exits publish kept too. A recovery valve, not a completion. 0 = off; nonzero is clamped to 50..60000."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.ForeignCopy]
class = "supported"
read = "AddAdapter and StartDevice"
effect = "1 enables the KMD's explicit-modifier copy of a foreign (NVK-on-RM) resource into the scan-out image and the device extension tier it needs. 0: the device and import without it."

[kmd.ForeignFlip]
class = "supported"
read = "transport generation (StartDevice)"
effect = "Nonzero: a WDDM allocation that adopted an imported RM resource (an NVK DWM's swap-chain buffers) is shown by the KMD's own `ScanoutFlip` instead of `SET_SCANOUT_BLOB` plus a Venus flush; refusals are counted (`FfRef<NN>`) and take the Venus path. 0: the Venus path for every allocation, which shows an NVK DWM's desktop as a black LINEAR buffer."
see = "[kmd-rm-client.md](../guest/windows/docs/kmd-rm-client.md)"

[kmd.GdiAccel]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "1 reports GDI hardware acceleration (`SupportKernelModeCommandBuffer`) and translates `DxgkDdiRenderKm` command buffers; 2 and 3 are one-bit caps experiments without acceleration. 0: no GDI acceleration."
see = "[vram-redirection.md](../guest/windows/docs/vram-redirection.md)"

[kmd.GdiOff]
class = "debug"
read = "StartDevice (with GdiAccel on)"
effect = "Bisect mask for `GdiAccel`: a set bit turns one path off (0x1, 0x4, 0x8, 0x10, 0x20) or one opt-in on (0x2, 0x40, 0x80, 0x100); the paths in force are mirrored as `GdiPaths`."
see = "[vram-redirection.md](../guest/windows/docs/vram-redirection.md)"

[kmd.GuestBlob]
class = "experiment"
read = "StartDevice"
effect = "1: while VidMm keeps a standard Present buffer in system memory, the Blt copy writes its pages through a virtio-gpu guest blob and skips the CPU mirror. Needs the host's guest-blob support (`conduit config venus.guest_blobs true`); without it nothing changes."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.HpdHiResWait]
class = "tuning"
read = "StartDevice"
effect = "1: the HPD worker's timed waits shorter than one default clock tick (the copy-engine route's 0.5 ms poll for its copies, the control poll, the foreign-scanout waits) are woken by a high-resolution timer at their due time instead of on the next 15.6 ms clock tick, so a finished copy retires its Present without waiting a tick. 0: the plain timed wait only."

[kmd.HwCursor]
class = "supported"
read = "AddAdapter and StartDevice"
effect = "1 reports a 256x256 hardware pointer when the host serves one and drives the host cursor from `SetPointerShape`/`SetPointerPosition` (independent flip needs it); 0 is the software cursor; 2 advertises whatever the host says."
default_note = "1 when IndepFlip is on (its default), else 0; an explicit value wins"
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[kmd.HwCursorCaps]
class = "experiment"
read = "each caps query (reboot)"
effect = "The `PointerCaps` word reported with the hardware pointer, masked to monochrome/color/masked-color. 0 means all three (7)."

[kmd.HwCursorMax]
class = "experiment"
read = "each caps query (reboot)"
effect = "Largest pointer size reported, clamped to 32..256. 0 means 256."

[kmd.HwCursorQ]
class = "debug"
read = "StartDevice"
effect = "1 sends hardware cursor commands on the dedicated cursor virtqueue when the host and VMM provide it; 0 keeps them on the control queue."

[kmd.HwQueuePktCap]
class = "experiment"
read = "AddAdapter"
effect = "`DXGK_VIDSCHCAPS::HwQueuePacketCap` (1..15): how many DMA packets dxgkrnl queues to a node at once. 0 = the OS default; dxgkrnl may ignore it at this driver's DDI version."

[kmd.IdfRedirSkip]
class = "experiment"
read = "StartDevice"
effect = "With `IndepFlip` on, a Present carrying `RedirectedFlip` on the Blt arm completes without a copy."
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[kmd.ImmFlip]
class = "tuning"
read = "AddAdapter and StartDevice"
effect = "Bit mask for immediate (tearing) flips: bit 0 skips the `ForeignFlip` minimum interval, bit 1 retires them as soon as their address is published, bit 2 reports `FlipImmediateMmIo`, bit 3 treats a promoted swap chain's flips as immediate. 0 turns all off."

[kmd.IndepFlip]
class = "supported"
read = "AddAdapter and StartDevice"
effect = "Independent flip: 1 advertises DirectFlip and `FlipIndependent | DdiPresentForIFlip` so a full-screen flip-model window is scanned out from its own buffers; 2 as 1, and an unregistered Venus DMA-buffer flip completes as a kept picture. 0 = every window is DWM-composed."
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[kmd.KmdRmClient]
class = "experiment"
read = "transport generation (StartDevice)"
effect = "The KMD's own RM client: 1 opens it and allocates an invisible surface, 2 also shows a test picture once, 3/4 present the desktop through a ring of RM surfaces, 5 allocates the primary itself from RM system memory. 0 = nothing is opened."
see = "[kmd-rm-client.md](../guest/windows/docs/kmd-rm-client.md)"

[kmd.KmdRmSysCache]
class = "experiment"
read = "RM service bring-up (with KmdRmClient 5)"
effect = "Memory type of the RM system-memory primary: 0 or 1 write-combined, 2 cached with the `Cached` flag, 3 a cached/write-combined alias. Other values mean 0."

[kmd.KmdRmSysPollMs]
class = "experiment"
read = "transport generation (with KmdRmClient 5)"
effect = "While an RM primary is shown, flip it again every N ms (50..5000) for writers the KMD cannot see (a GDI-only session). 0 = off."

[kmd.MirChanged]
class = "tuning"
read = "StartDevice"
effect = "1 skips a counter-mirror write whose value the registry already holds (every value is still rewritten at least every 30 s); 0 writes every value every pass."

[kmd.MirPrio]
class = "tuning"
read = "StartDevice"
effect = "Kernel priority of the counter-mirror thread (1..15), below the HPD worker's 8. 0 leaves it alone; other values mean the default."

[kmd.MirYield]
class = "tuning"
read = "StartDevice"
effect = "The mirror thread rests 1 ms after this many registry writes of one pass. 0 = never."

[kmd.MirrorThread]
class = "debug"
read = "StartDevice"
effect = "1 publishes the counter mirror from its own thread once a second; 0 publishes inline on the HPD worker."

[kmd.MsiBreaker]
class = "state"
read = "AddDevice"
effect = "How many times the MSI-X boot-loop breaker tripped (a count the driver keeps)."
see = "[msi-interrupts.md](../guest/windows/docs/msi-interrupts.md)"

[kmd.MsiLatch]
class = "state"
read = "AddDevice and StartDevice"
effect = "Set to 1 by the driver when MSI-X delivery failed or the breaker tripped, so the next AddDevice asks for INTx. An operator may clear it (0) to retry MSI-X or set it to rehearse the fallback."
see = "[msi-interrupts.md](../guest/windows/docs/msi-interrupts.md)"

[kmd.MsiLatchOld]
class = "state"
read = "AddDevice"
effect = "How many latches of another driver build AddDevice set aside (a count the driver keeps)."

[kmd.MsiLatchVer]
class = "state"
read = "AddDevice"
effect = "Build tag of the image that wrote `MsiLatch`; another build's latch is stale and cleared. 0 = written by hand, honoured."

[kmd.MsiLatchWhy]
class = "state"
read = "AddDevice"
effect = "Why the KMD latched (1..4); absent on an operator's latch."

[kmd.MsiMarkerOld]
class = "state"
read = "AddDevice"
effect = "How many boot-loop markers of another build AddDevice consumed without tripping the breaker (a count the driver keeps)."

[kmd.MsiMode]
class = "tuning"
read = "AddDevice (the first restart writes MSISupported, the second applies it)"
effect = "Interrupt mode the driver asks PnP for: 0 follows the INF/device key (the INF writes INTx), 1 INTx always, 2 (default) MSI-X with the breaker and latch, 3 MSI-X without them (debugging)."
see = "[msi-interrupts.md](../guest/windows/docs/msi-interrupts.md)"

[kmd.MsiStarting]
class = "state"
read = "AddDevice"
effect = "Boot-loop breaker marker: set by a start that got MSI-X messages and cleared once interrupts arrive."

[kmd.MsiStartingVer]
class = "state"
read = "AddDevice"
effect = "Build tag of the image that set `MsiStarting`; only the running build's marker trips the breaker."

[kmd.MsiVectors]
class = "debug"
read = "transport init (StartDevice)"
effect = "1 forces one shared MSI-X message for every queue even when more were granted; 0 uses per-source vectors. Does not choose INTx (that is `MsiMode`)."
see = "[msi-interrupts.md](../guest/windows/docs/msi-interrupts.md)"

[kmd.NvDupHarden]
class = "supported"
read = "once per boot"
effect = "Cross-client hardening of forwarded RM ioctls: 2 records and checks every handle and counts what would be refused (`NvDupWould`), 1 refuses requests naming another process's RM objects, 0 = off. Other nonzero values enforce."
see = "[nvrm-escape.md](../guest/windows/docs/nvrm-escape.md)"

[kmd.NvSpinUs]
class = "tuning"
read = "first forwarded RM message"
effect = "Microseconds a forwarded RM message polls for its reply before blocking (backs off by itself while the host is slower). 0 = no spin; clamped to 200."
see = "[nvrm-forward-path.md](../guest/windows/docs/nvrm-forward-path.md)"

[kmd.NvWinMaxMb]
class = "tuning"
read = "transport init (StartDevice)"
effect = "Caps the bytes mapped through the RM window below the window's size (bounds the non-paged pool the mapping MDLs cost). 0 = the whole window."

[kmd.NvWinPolicy]
class = "tuning"
read = "transport init (StartDevice)"
effect = "RM window policy: 1 = dynamic (any device maps until the window is full, minus the privileged reserve); 0 = a fixed quarter of the window per device with fixed tables."
see = "[nvrm-escape.md](../guest/windows/docs/nvrm-escape.md)"

[kmd.NvWinReserveMb]
class = "tuning"
read = "transport init (StartDevice)"
effect = "MiB of the RM window only the privileged device (the foreign scanout source, DWM on NVK, the KMD's own RM client) may use; clamped to the window."

[kmd.OutputTech]
class = "supported"
read = "QueryChildRelations (restart-device applies)"
effect = "Connector type of the virtual monitor: 1 DisplayPort, 2 HDMI, 3 DVI, 4 internal, 0 HD15 (analog VGA, which limits modes to 60 Hz). Other values mean DisplayPort."

[kmd.PresentProbe]
class = "debug"
read = "AddAdapter and StartDevice"
effect = "1 turns on per-present probe instrumentation."

[kmd.PresentWmk]
class = "tuning"
read = "transport init (StartDevice)"
effect = "1 gates a submission carrying a live present boundary on that boundary alone; 0 also waits for every earlier transport entry, which delays the present's DMA fence by the whole pipeline depth."

[kmd.RedirVram]
class = "supported"
read = "StartDevice"
effect = "1: GPU-only GDI surfaces in RM video memory, the redirected Blt into them on the copy engine, CPU access through a bounce buffer. Also makes the D3D11 UMD's `NvkSkipBltCopy` default 1. 0 = off."
see = "[vram-redirection.md](../guest/windows/docs/vram-redirection.md)"

[kmd.RestChk]
class = "state"
read = "StartDevice (with RestSeed on)"
effect = "Check word of the persisted flip address (see `RestSeed`)."

[kmd.RestIssHi]
class = "state"
read = "StartDevice (with RestSeed on)"
effect = "High half of the newest flip address dxgkrnl issued, persisted for `RestSeed`."

[kmd.RestIssLo]
class = "state"
read = "StartDevice (with RestSeed on)"
effect = "Low half of the newest flip address dxgkrnl issued, persisted for `RestSeed`."

[kmd.RestSeed]
class = "debug"
read = "StartDevice"
effect = "1 persists the newest issued flip address (`RestIssLo`/`RestIssHi`/`RestUpS`/`RestChk`) and seeds the restarted vsync heartbeat from it after a restart that reloaded the driver image; 0 writes and reads nothing."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.RestUpS]
class = "state"
read = "StartDevice (with RestSeed on)"
effect = "Uptime stamp of the persisted flip address (see `RestSeed`)."

[kmd.RmCeCache]
class = "experiment"
read = "StartDevice (with RmCopyEngine nonzero)"
effect = "Memory type of the copy-engine channel's own RM system memory: 0 cached, 1 write-combined."

[kmd.RmCopyEngine]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "The KMD's RM copy-engine channel: 1 routes windowed Present copies through it, 2 runs its hardware self-test once, 3 is the shadow mode (a sample of Presents copied again and compared). Other values mean 0 = nothing allocated."
see = "[rm-copy-engine-present.md](../guest/windows/docs/rm-copy-engine-present.md)"

[kmd.RmGateMs]
class = "debug"
read = "StartDevice"
effect = "An RM fence gate whose `EventReady` has not arrived this many ms after the fence was attached is declared fired (`RmGExp`), so the present it gates cannot wait forever. 0 = never; nonzero is clamped to 1000..120000."
see = "[rm-fence-marker.md](../guest/windows/docs/rm-fence-marker.md)"

[kmd.RvOff]
class = "debug"
read = "StartDevice"
effect = "Per-path bisect switches for `RedirVram` (bits in `helios_kmd_logic::rm_vidmem::off`)."

[kmd.SmoothRotCaps]
class = "experiment"
read = "each caps query (reboot)"
effect = "1 reports `DXGK_DRIVERCAPS.SupportSmoothRotation`."

[kmd.StageTrace]
class = "debug"
read = "StartDevice"
effect = "1 records per-frame stage timestamps of the windowed Present copy and the `ForeignFlip` path into the `StgRing` binary value. 0 = off (one relaxed load per stamp site)."
see = "[TRACING.md](TRACING.md)"

[kmd.StopFlush]
class = "debug"
read = "StopDevice"
effect = "1 flushes the service key to disk at StopDevice's first and last stage, so `StopStg` survives a bugcheck inside the stop; 0 skips the flushes."

[kmd.SubKickUnlock]
class = "tuning"
read = "transport init (StartDevice)"
effect = "1 rings the control queue's doorbell after releasing the virtio lock (one MMIO write) instead of inside it; 0 rings it under the lock."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.SubSpaceWake]
class = "tuning"
read = "AddAdapter and StartDevice"
effect = "1 retries a full Venus transport queue on a capacity notification; 0 polls every 1 ms."

[kmd.SubStageClk]
class = "debug"
read = "StartDevice"
effect = "1 timestamps the display submitters' stages (`Sub*`, `SubW*`, `SubF*`); 0 keeps only the counts, to measure the clock's own cost."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.SubmitPool]
class = "tuning"
read = "StartDevice"
effect = "1 takes the display submitters' staged DMA buffers from the transport's bounded pool; 0 allocates contiguous memory per submit."
see = "[zero-copy-present.md](../guest/windows/docs/zero-copy-present.md)"

[kmd.VidMmCapsX]
class = "experiment"
read = "AddAdapter and StartDevice"
effect = "Extra `DXGK_VIDMMCAPS` bits ORed into `MemoryManagementCaps`; only 0x200 (`NonCpuVisiblePrimary`) is accepted."
see = "[vram-redirection.md](../guest/windows/docs/vram-redirection.md)"

[kmd.VidMmVramMB]
class = "experiment"
read = "AddAdapter, resolved at StartDevice"
effect = "Device-memory capacity reported to VidMm (the dedicated video memory games and dxdiag see), in MiB. 0 selects the fixed one-GiB aperture+BAR topology."
default_note = "u32::MAX = auto: the host GPU's video memory (largest device-local Vulkan heap, capped at 65536); if the Venus device cannot tell, the host-visible size the virtio capability reports (0 if that is out of range)"

[kmd.VsCatchUp]
class = "tuning"
read = "StartDevice"
effect = "1 serves one missed vsync heartbeat slot with an immediate extra tick when a tick ran between one and 1.5 periods late; 0 drops it."

[kmd.VsIdleWake]
class = "debug"
read = "StartDevice"
effect = "1 wakes the HPD worker 4 times a second while the heartbeat is armed, to run the watchdog (needs `VsWatchdog` above 0)."

[kmd.VsPowerMode]
class = "debug"
read = "StartDevice"
effect = "Which `DxgkDdiSetPowerState` calls quiesce the vsync heartbeat: 1 only the adapter leaving D0, 0 any non-D0 state of any device (the monitor child included)."

[kmd.VsWatchdog]
class = "debug"
read = "StartDevice"
effect = "Heartbeat watchdog: 1 revives an armed but silent heartbeat, 2 also re-arms a quiesced one while the adapter is in D0, 0 = off."

[kmd.VsWdTimer]
class = "debug"
read = "StartDevice"
effect = "1 runs the independent 250 ms watchdog timer that re-arms a silent heartbeat in D0 and refreshes the heartbeat block every 2 s; 0 never arms it."

[kmd.VsyncRateMhz]
class = "debug"
read = "StartDevice"
effect = "Forces the vsync heartbeat's rate in millihertz (60000 = 60 Hz) whatever the mode's refresh rate. 0 follows the mode."

[kmd.WddmHeadMs]
class = "tuning"
read = "transport init (StartDevice)"
effect = "How long the WDDM fence FIFO head may stay blocked on a tagged dependency before it is rebased onto the wire watermark (`WfBReb`): a bounded last resort against a TDR. 0 = off; nonzero is clamped."

[kmd.WddmHoldMs]
class = "experiment"
read = "transport init (StartDevice)"
effect = "Holds a D3D12 ECL packet's DMA completion back by N ms after its real dependencies are met, to test whether dxgkrnl orders fence signals behind it. 0 = off, the only value to run; clamped."

# --- HKLM\SOFTWARE\Helios ---


[umd.DesktopFollowsDwm]
class = "supported"
read = "once per process (ICD choice)"
effect = "1: while DWM composes on NVK (DwmIcd=nvk and its marker event exists) every other process goes to NVK too, and Icd and the built-in deny-list no longer apply; only NvkDenyList keeps a process on Venus. 0 turns this rule off."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.DirectFlipSupport]
class = "supported"
read = "once per process"
effect = "What the D3D11.1 CheckDirectFlipSupport DDI answers, which DWM uses for independent flip: 0 never; 1 yes when the KMD reports DirectFlip and size and format are equal; 2 whenever size and format match (test lever); 3 as 1, only for formats the KMD scans out as is; 4 the same as 1; 5 as 1, and two different 8-bit scan-out formats (R8G8B8A8 on a B8G8R8A8 desktop) also pair. HELIOS_DIRECT_FLIP_SUPPORT overrides it per process."
see = "[independent-flip.md](../guest/windows/docs/independent-flip.md)"

[umd.DwmIcd]
class = "supported"
read = "each DWM start (dwm.exe); other processes per process for the desktop-follows rule"
effect = "nvk: DWM composes the desktop on NVK on RM, whatever Icd and the deny-lists say, guarded by the crash-loop guard (DwmNvkMaxStarts, DwmNvkGuardSeconds, DwmNvkHealthySeconds). Absent or venus: DWM stays on Venus. install.ps1 sets nvk."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.DwmNvkGuardSeconds]
class = "supported"
read = "each DWM start with DwmIcd=nvk"
effect = "The window, in seconds, of the DwmIcd=nvk crash-loop guard: when DwmNvkMaxStarts DWM starts on NVK that never got healthy fall inside it, the next DWM start goes to Venus."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.DwmNvkHealthySeconds]
class = "supported"
read = "each DWM start with DwmIcd=nvk"
effect = "How long, in seconds, a DWM on NVK must keep presenting after its choice to count as healthy: it then clears the crash-loop guard's history (%ProgramData%\\Helios\\dwm-nvk-starts.txt), so restarts and live driver updates never add up to a crash loop. 0 = at its first NVK present."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.DwmNvkMaxStarts]
class = "supported"
read = "each DWM start with DwmIcd=nvk"
effect = "How many DWM starts on NVK within DwmNvkGuardSeconds that never got healthy (DwmNvkHealthySeconds) send the next start to Venus (the crash-loop guard; pending starts are kept in %ProgramData%\\Helios\\dwm-nvk-starts.txt; only starts of the installed driver build in other DWM processes count). If Venus then cannot create DWM's device, DWM runs on NVK after all. 0 disables the guard."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.FeatureLevel11]
class = "debug"
read = "once per process"
effect = "The D3D11 feature-level caps profile the UMD reports: 1 the full FL11_0 profile (pipeline 11_0, real MSAA, unmasked format bits); 0 the FL10_0 profile; 2 a diagnostic mix (pipeline 11_0 with the FL10 MSAA and format caps)."

[umd.ForeignImport]
class = "experiment"
read = "once per process"
effect = "1: a Venus process (DWM above all) imports surfaces NVK processes made through explicit DRM-modifier imports, so a windowed NVK app can be composed by a Venus DWM; it also makes NVK presents compose through DWM. 0 or absent: off. Not needed with DwmIcd=nvk."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.Icd]
class = "supported"
read = "once per process (ICD choice)"
effect = "venus: D3D11, OpenGL and Vulkan processes stay on Venus unless NvkAllowList or NvkDefaults names them (D3D12 is not affected). Absent: processes go to NVK on RM unless a deny-list keeps them on Venus. HELIOS_ICD overrides it per process."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.ManageDisplay]
class = "supported"
read = "at logon (Set-HeliosDisplay.ps1)"
effect = "0: the logon task leaves the display topology alone. Absent or any other value: the task makes the Helios display the only active one (the Microsoft Basic Display adapter stays enabled but inactive)."

[umd.Nvk12]
class = "supported"
read = "once per process (D3D12 ICD choice)"
effect = "0 keeps every D3D12 process on Venus (no FL12 there). Absent or 1: D3D12 goes to NVK on RM unless HELIOS_ICD12, NvkDenyList12 or the deny-lists say otherwise."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.Nvk12AdmitAfterPresentOnly]
class = "debug"
read = "once per process"
effect = "1: on NVK only the first ExecuteCommandLists of each queue after a Present waits for the runtime admission event; other batches go to the engine at once. A measurement of the per-batch admission round trip that can race applications relying on cross-queue waits; never a setting."

[umd.Nvk12AdmitBeforeRender]
class = "tuning"
read = "once per process"
effect = "With Nvk12EclSync=2: 1 queues an ExecuteCommandLists' admission event before its HE12 v4 packet, so the batch reaches NVK once everything before it on the context was submitted and three batches can be on the GPU; runtime waits before the ECL still hold it and signals after it still follow the work. 0 queues the admission after the packet, so a batch waits for its own packet's in-flight slot and two batches can be on the GPU. Counter EclAdmitBeforeRender."
see = "[rm-fence-marker.md](../guest/windows/docs/rm-fence-marker.md#completion-hints)"

[umd.Nvk12CompletionHint]
class = "experiment"
read = "once per process"
effect = "With Nvk12EclSync=2: microseconds vkd3d's queue worker polls, per admission wait, the queue's producer timeline and the admission event; each batch it sees finish has its ECL fence named to the KMD (HELIOS_ESCAPE_ECL_DONE), which completes the batch's packet without waiting for the host's EventReady. 0 = off; off as well when the KMD does not serve the escape. Costs up to that much of one core per wait. Clamped to 20000."
see = "[rm-fence-marker.md](../guest/windows/docs/rm-fence-marker.md#completion-hints)"

[umd.Nvk12EclFencePrefetch]
class = "tuning"
read = "once per process"
effect = "With Nvk12EclSync=2: 1 makes the queue's next ECL fence as soon as an ECL is admitted, so the next submission does not wait for the fence-create round trip; 0 makes each fence inline."

[umd.Nvk12EclSpinUs]
class = "tuning"
read = "once per process"
effect = "Microseconds the CPU-wait arm of Nvk12EclSync (value 1) polls the engine before it blocks; 0 blocks at once. Clamped to 50000."

[umd.Nvk12EclSync]
class = "tuning"
read = "once per process"
effect = "How the D3D12 runtime's context is ordered behind NVK work: 2 an RM fence per ExecuteCommandLists that the KMD waits for before completing the packet (falls back to 0 without NVK and KMD support); 0 a UMD monitored fence signalled by a per-queue worker; 1 ExecuteCommandLists waits on the CPU until its work completed. Values above 2 count as 2."

[umd.Nvk12Present]
class = "supported"
read = "once per process"
effect = "How a D3D12 NVK swap chain presents: 0 automatic (a window is composed by DWM when DWM imports NVK surfaces, i.e. DWM runs on NVK or ForeignImport=1; a back buffer that covers the output (a primary, or at least the desktop's size) takes scanout 0, as does every buffer when DWM cannot import NVK surfaces); 1 always scanout 0 (zero-copy flip, the desktop hidden while the app presents); 2 always the WDDM present (DWM composes). HELIOS_NVK_PRESENT overrides it per process."

[umd.Nvk12ScanoutFence]
class = "tuning"
read = "once per process"
effect = "With Nvk12EclSync=2: 1 hands a scanout present to a flip that waits for the frame's last ECL fence instead of waiting on the CPU before flipping; 0 is the CPU wait."

[umd.Nvk12WorkerSpinUs]
class = "tuning"
read = "once per process"
effect = "With Nvk12EclSync=0: microseconds the per-queue worker polls the engine for a boundary before it blocks; 0 blocks at once. Clamped to 50000."

[umd.NvkAllowList]
class = "supported"
read = "once per process (ICD choice)"
effect = "Executable names (';'-separated, case-insensitive) that go to NVK on RM even under Icd=venus or the built-in deny-list. NvkDenyList still wins over NvkDefaults, not over this list."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.NvkAsyncPresentFence]
class = "tuning"
read = "once per process"
effect = "1: a composed NVK present's RM fence takes a value reserved at the Present call and signalled by DXVK's submission thread, so the presenting thread does not wait for DXVK's worker threads; 0 waits for the submission first. HELIOS_NVK_ASYNC_PRESENT_FENCE overrides it per process."

[umd.NvkComposedComplete]
class = "supported"
read = "once per process"
effect = "1: a composed NVK frame that DWM samples directly (a flip-model swap chain's own buffer) is complete on the GPU before its WDDM present, so a DWM on NVK never composes a half-drawn frame. 0 lets the frame carry an RM fence instead, as blt-model frames do. HELIOS_NVK_COMPOSED_COMPLETE overrides it per process."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.NvkDefaults]
class = "supported"
read = "once per process (ICD choice)"
effect = "1: the built-in list of system executables measured to work on NVK (csrss, winlogon, fontdrvhost, taskmgr, mmc, the Start menu and Settings hosts, ...) goes to NVK even under Icd=venus, unless NvkDenyList names them. 0 or absent: off."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.NvkDenyList]
class = "supported"
read = "once per process (ICD choice)"
effect = "Executable names (';'-separated) that stay on Venus. When set it replaces the built-in deny-list (compositor, shell, browsers, video players, ...) and wins even while the desktop follows an NVK DWM."
see = "[dwm-on-nvk.md](dwm-on-nvk.md)"

[umd.NvkDenyList12]
class = "supported"
read = "once per process (D3D12 ICD choice)"
effect = "Executable names (';'-separated) whose D3D12 devices stay on Venus, for titles that need what NVK lacks (DXR ray tracing above all)."

[umd.NvkIcdPath]
class = "debug"
read = "once per process (64-bit)"
effect = "Path of the 64-bit NVK ICD to load instead of the one installed next to the UMD (used only if the file exists). HELIOS_NVK_ICD overrides it per process."

[umd.NvkIcdPath32]
class = "debug"
read = "once per process (WoW64)"
effect = "Path of the 32-bit NVK ICD to load instead of the one installed next to the UMD (used only if the file exists). HELIOS_NVK_ICD overrides it per process."

[umd.NvkPlaceholderAllocations]
class = "debug"
read = "once per process"
effect = "1: never ask NVK for resource ids; every WDDM-backed texture gets a KMD placeholder allocation (A/B and fallback lever). 0: NVK resource ids."

[umd.NvkPresent]
class = "supported"
read = "once per process"
effect = "How a D3D11 NVK swap chain presents: 0 automatic (compose through DWM when the KMD gave the back buffer a resource id, else scanout 0); 1 always scanout 0 (zero-copy flip, the desktop hidden while the app presents); 2 always the WDDM present (DWM composes). HELIOS_NVK_PRESENT overrides it per process."

[umd.NvkRmCopyRecord]
class = "tuning"
read = "once per process"
effect = "1: a composed NVK present that carries an RM fence also carries the copy-engine Present record when the KMD reads it; whether the frame is copied on the copy engine is the KMD's RmCopyEngine. 0: the plain fence forms. HELIOS_NVK_RM_COPY_RECORD overrides it per process."
see = "[rm-copy-engine-present.md](../guest/windows/docs/rm-copy-engine-present.md)"

[umd.NvkRmFence]
class = "tuning"
read = "once per process"
effect = "1: an NVK scanout present hands its flip an RM fence and does not wait on the CPU for the frame (needs NVK and host support, else NVK's flip thread waits). 0: a CPU wait before every NVK present. HELIOS_NVK_RM_FENCE overrides it per process."
see = "[rm-fence-marker.md](../guest/windows/docs/rm-fence-marker.md)"

[umd.NvkRmFencePresent]
class = "tuning"
read = "once per process"
effect = "1: when DWM composes an NVK app's frames, the WDDM present carries the RM fence and the KMD retires the present on it. 0: a CPU wait for composed frames. HELIOS_NVK_RM_FENCE_PRESENT overrides it per process."
see = "[rm-fence-marker.md](../guest/windows/docs/rm-fence-marker.md)"

[umd.NvkScanoutComposeEvery]
class = "tuning"
read = "once per process"
effect = "How often a frame NVK already showed on scanout 0 also goes through the WDDM present to DWM: 0 only the first frame, N the first and every Nth after it, 1 every frame. HELIOS_NVK_SCANOUT_COMPOSE_EVERY overrides it per process."
default_note = "absent: 1 for processes on the WDDM 2.3 D3D11 DDI (UmdDdiLevel), else 0"

[umd.NvkSkipBltCopy]
class = "experiment"
read = "once per process"
effect = "1: a windowed NVK present with a DXGI destination is not copied by the UMD; the KMD's Blt reads the present's source and writes it at the window's client offset. 0: the UMD copies the frame into the destination. HELIOS_NVK_SKIP_BLT_COPY overrides it per process."
default_note = "absent: 1 when the KMD's RedirVram is 1 (its service key), else 0"

[umd.RotateSample]
class = "debug"
read = "once per process"
effect = "N > 0: the DXVK bridge records a pixel sample of every Nth swap-chain buffer rotation to the UMD log (write-side check that composed frames carry pixels). 0 or absent: off."

[umd.ScanoutAcquire]
class = "debug"
read = "once per process"
effect = "Kill switch of the scanout-read acquire: 1 makes a command list that rewrites a scan-out buffer wait on the GPU timeline while the host still reads it; 0 turns the mechanism off (no escapes, no wait)."

[umd.ScanoutSnapshot]
class = "debug"
read = "once per process"
effect = "Kill switch of the direct-flip present snapshot: 1 copies the presented primary into a GPU-ordered snapshot image the KMD scans out (needs the KMD capability); 0 scans out the presented image itself. MSAA and sRGB sources are normalized either way."

[umd.ShaderBytecodeDumpPath]
class = "debug"
read = "once per process"
effect = "A directory: the D3D11 bridge writes every shader's DXBC bytecode there (created if missing). Absent: no dump."

[umd.ShaderDumpPath]
class = "debug"
read = "once per process"
effect = "A directory: the bridge sets DXVK_SHADER_DUMP_PATH to it in every UMD-hosting process (DWM included), so DXVK dumps its shaders there. Absent: no dump."

[umd.Umd12ContextNode]
class = "experiment"
read = "once per process"
effect = "1: D3D12 queue contexts on NVK ask for WDDM node 1 (reported by the KMD's D3d12Node=1), completed independently of node 0, so a D3D12 batch held for its RM fence does not wait behind presents; a refusal falls back to node 0. 0: node 0."

[umd.Umd12DdiTimes]
class = "debug"
read = "once per process"
effect = "1: every forwarding D3D12 DDI adds its wall time to a per-DDI total and each frame-time window logs the eight costliest DDIs. 0: off."

[umd.Umd12EclDelayUs]
class = "debug"
read = "once per process"
effect = "Microseconds ExecuteCommandLists delays its return, a measurement that attributes the runtime's fence advance (never a fix). 0: no delay. Clamped."

[umd.Umd12FenceSignalDelayUs]
class = "debug"
read = "once per process"
effect = "Microseconds pfnSignalFence is delayed, the companion measurement of Umd12EclDelayUs (run one at a time, never a fix). 0: no delay. Clamped."

[umd.Umd12FenceVaProbe]
class = "debug"
read = "once per process"
effect = "1: at device creation, create one monitored fence through the runtime's kernel callbacks and log its GPU virtual address (a probe; no behaviour change). 0: off."

[umd.Umd12FormatCaps]
class = "debug"
read = "once per process"
effect = "The D3D12 CheckFormatSupport encoding: 0 translates the engine's bits into the DDI enum narrowed to the driver's caps; 1 hands the API bits back unchanged (a losing A/B arm)."

[umd.Umd12MergeEcl]
class = "debug"
read = "once per process"
effect = "With Nvk12EclSync=2: 1 holds each ExecuteCommandLists packet and lets the next one's fence stand for it, measuring what fewer packets per frame would give; unsafe for applications that signal or wait between submissions. 0: off."

[umd.Umd12PipelineLibrary]
class = "debug"
read = "once per process"
effect = "1: the D3D12 pipeline-library DDIs forward to the engine's ID3D12PipelineLibrary1. 0: they refuse with E_NOTIMPL and applications create PSOs directly."

[umd.Umd12Trace]
class = "debug"
read = "once per process"
effect = "1: per-op and per-frame DDI trace lines of the D3D12 UMD in its log. 0: off."

[umd.Umd12WaitSplit]
class = "debug"
read = "once per process"
effect = "1: every 256 frames, log how the presenting thread's frame splits between this driver's DDIs and the rest, on and off the CPU. 0: off."

[umd.UmdAsyncPresentStream]
class = "debug"
read = "once per process"
effect = "Kill switch of the registered present stream: 1 lets a folded present skip the old frame gate when the KMD correlates it; 0 keeps the frame gate."

[umd.UmdCommandLists]
class = "tuning"
read = "once per process"
effect = "1 (with UmdFreeThreaded on): the D3D11 UMD reports native command lists, so deferred contexts record through DXVK instead of the runtime's emulation. 0: the runtime emulates command lists."

[umd.UmdD3D12]
class = "supported"
read = "once per process (OpenAdapter12)"
effect = "The D3D12 kill switch: 0 makes the D3D12 UMD refuse every adapter open (DXGI_ERROR_UNSUPPORTED), as if there were no D3D12 driver. 1 or absent: D3D12 on."

[umd.UmdDdiAllowList]
class = "experiment"
read = "once per process"
effect = "Executable names (';'-separated) that get the WDDM 2.3 D3D11 DDI even when UmdDdiLevel is 0x10."

[umd.UmdDdiLevel]
class = "experiment"
read = "once per process (not dwm.exe)"
effect = "The D3D11 DDI interface the UMD advertises to every process but DWM: 0x24 WDDM 2.3, 0x10 WDDM 1.3 (other values count as 0x10). HELIOS_UMD_DDI overrides it per process."

[umd.UmdDdiLevelDwm]
class = "experiment"
read = "once per DWM start"
effect = "UmdDdiLevel for dwm.exe only: 0x10 WDDM 1.3, 0x24 WDDM 2.3."

[umd.UmdDeferredDiagnostics]
class = "debug"
read = "once per process"
effect = "1: success-path counters and sampled logs of the deferred-context and command-list path. 0: none (no diagnostic atomics in the timed path)."

[umd.UmdFrameTrace]
class = "debug"
read = "once per process"
effect = "Non-zero: a per-Present timing trace of the D3D11 threaded front end (only devices that use it). 0: off."
see = "[d3d11-threaded-frontend.md](../guest/windows/docs/d3d11-threaded-frontend.md)"

[umd.UmdFreeThreaded]
class = "tuning"
read = "once per process"
effect = "1: the D3D11 UMD reports FREETHREADED caps, so the runtime stops serializing create and destroy DDIs behind its device lock. 0: threading caps 0 (and no native command lists)."

[umd.UmdFrontendRingKiB]
class = "tuning"
read = "once per process"
effect = "The threaded front end's command ring per immediate context, in KiB (clamped to 256..65536)."
see = "[d3d11-threaded-frontend.md](../guest/windows/docs/d3d11-threaded-frontend.md)"

[umd.UmdFrontendSync]
class = "debug"
read = "once per process"
effect = "A class mask of front-end calls forced onto the synchronous path, for bisecting the threaded front end. 0: none."
see = "[d3d11-threaded-frontend.md](../guest/windows/docs/d3d11-threaded-frontend.md)"

[umd.UmdPresentBatchFold]
class = "debug"
read = "once per process"
effect = "Kill switch: 1 records an ordinary present's fence signal before the frame's flush so it shares the frame's submission; 0 records it after the flush."

[umd.UmdThreadedFrontend]
class = "tuning"
read = "once per process"
effect = "The D3D11 threaded front end (immediate-context calls recorded into a ring and replayed on a worker): 1 on for every process except dwm.exe, 0 off, 2 on including dwm.exe. HELIOS_D3D11_FRONTEND (0 or 1) overrides it per process."
see = "[d3d11-threaded-frontend.md](../guest/windows/docs/d3d11-threaded-frontend.md)"

[umd.UmdTimerRes]
class = "tuning"
read = "once per process (device creation)"
effect = "The process timer resolution the D3D11 UMD requests: 0 none, 1 timeBeginPeriod(1), larger values NtSetTimerResolution in 100 ns units (5000 = 0.5 ms)."

[umd.UmdTrace]
class = "debug"
read = "once per process"
effect = "1: per-frame and per-op DDI trace lines of the D3D11 UMD in its log. 0: off."

[umd.VehicleFlipGateUs]
class = "tuning"
read = "once per process"
effect = "Upper bound, in microseconds, of the wait for a DirectComposition vehicle frame copy's host GPU completion before its flip is issued, so a direct flip never scans out a buffer before the copy lands. 0 disables the gate."

[umd.VideoDdi]
class = "supported"
read = "once per process"
effect = "Which D3D11 devices get the video DDI (decoder and video processor): 0 none, 1 NVK devices (H.264 decode on Vulkan Video), 2 every device (Venus gets the video processor, no decoder). Unless 0, the bridge also sets NVK_EXPERIMENTAL=video for NVK processes."
see = "[d3d11-video-decode.md](../guest/windows/docs/d3d11-video-decode.md)"

# --- Environment variables ---


[env.DXVK_HELIOS_VIDEO_DECODE]
class = "debug"
read = "DXVK device creation"
effect = "0 keeps DXVK's Vulkan video decode queue and its extensions off, and with them the D3D11 video decoder. Any other value or unset leaves video decode on where the ICD offers it."
see = "[d3d11-video-decode.md](../guest/windows/docs/d3d11-video-decode.md)"

[env.HELIOS_D3D11_FRONTEND]
class = "experiment"
read = "once per process"
effect = "1 turns the D3D11 threaded front end on for this process, 0 turns it off; it wins over HKLM\\SOFTWARE\\Helios UmdThreadedFrontend. Other values fall through to the registry."
see = "[d3d11-threaded-frontend.md](../guest/windows/docs/d3d11-threaded-frontend.md)"

[env.HELIOS_DIRECT_FLIP_SUPPORT]
class = "debug"
read = "once per process"
effect = "Overrides HKLM\\SOFTWARE\\Helios DirectFlipSupport for this process (same values: what the CheckDirectFlipSupport DDI answers)."

[env.HELIOS_DISABLE_INTERNAL_SEM_FEEDBACK]
class = "debug"
read = "timeline semaphore creation (Venus ICD)"
effect = "True disables Venus' feedback slots for internal (non-external) timeline semaphores, so their values are read from the host instead. A bisect switch."

[env.HELIOS_DXGI_NO_REDIRECTION]
class = "debug"
read = "every CreateDevice"
effect = "When set (any value), the D3D11 UMD's CreateDevice returns DXGI_STATUS_NO_REDIRECTION, making DXGI fall back to its desktop path. A diagnostic."

[env.HELIOS_DXVK_BACKEND]
class = "experiment"
read = "DXVK instance and device creation"
effect = "Internal: the D3D11 bridge sets it to nvk for a process that runs on NVK on RM and clears it for Venus, before DXVK starts; DXVK then picks the NVK paths. A value set by hand is overwritten."

[env.HELIOS_DXVK_FOREIGN_IMPORT]
