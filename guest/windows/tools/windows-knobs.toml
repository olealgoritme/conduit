effect = "1 hands composed presents to a WSI thread so the application's present call does not wait for the D3D11 flip; 0 presents on the calling thread."

[env.MESA_WSI_SCANOUT_HZ]
class = "experiment"
read = "swapchain creation"
effect = "Caps the rate of FIFO presents on a scanout swap chain to this many Hz. 0 leaves scanout presents unpaced."

[env.MESA_WSI_SCANOUT_MIN_IMAGES]
class = "tuning"
read = "surface capability query"
effect = "Minimum image count a Win32 scanout surface reports to the application (clamped)."

[env.MESA_WSI_WIN32_FIFO_ONLY]
class = "debug"
read = "surface capability query"
effect = "1 reports only FIFO as a Win32 present mode; 0 also offers the immediate and mailbox modes."

[env.NAK_GPR_CAP]
class = "experiment"
read = "device creation (once per process)"
effect = "Caps the registers per thread NAK gives every shader stage, counted as the hardware allocates them (and NVK_SHADER_STATS reports them, the 2 reserved GPRs included) and rounded down to a multiple of 8; the pre-RA scheduler schedules for the cap and register allocation spills what does not fit, trading spills for occupancy. Unset, 0 or 256 and up: no cap; below 24 counts as 24. Part of the shader cache key."

[env.NAK_GPR_CAP_CS]
class = "experiment"
read = "device creation (once per process)"
effect = "NAK_GPR_CAP for compute shaders only, overriding NAK_GPR_CAP; 0 leaves compute shaders uncapped."

[env.NAK_GPR_CAP_FS]
class = "experiment"
read = "device creation (once per process)"
effect = "NAK_GPR_CAP for fragment shaders only, overriding NAK_GPR_CAP; 0 leaves fragment shaders uncapped."

[env.NAK_OCC_TARGET]
class = "tuning"
read = "device creation (once per process)"
effect = "On by default (unset or 1); 0 turns it off. Rematerialization in NAK's GPR spiller (cheap values such as constants, constant-buffer and constant-memory loads, thread/CTA IDs and short ALU chains are recomputed at reloads instead of going to local memory; constant-memory loads through a constant-buffer address reload with one LDG from a UGPR copy of the address) and a per-shader register target: after scheduling, NAK estimates the cost of spilling down to each lower register count that gives more warps per SM (workgroup and shared memory limits included) and uses the one with the best estimated gain, never one that needs more than a few memory spills or any inside a loop. A NAK_GPR_CAP for a stage overrides the target of that stage and then spills with rematerialization. Part of the shader cache key."

[env.NAK_IMM_CSE]
class = "tuning"
read = "first shader compile (once per process)"
effect = "Unset: in compute shaders, a register copy of an immediate (needed when an instruction cannot take two immediates, such as an FFMA by two constants) serves the following uses of that immediate in its block, as long as each is at most 16 instructions after the previous one. 1 does it in every stage (it can cost occupancy in fragment and vertex shaders), 0 never. Part of the shader cache key."

[env.NAK_UADDR_PIN]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. The uniform 64-bit base addresses of global memory accesses inside a divergent if (vkd3d-proton descriptor heaps, root constant buffers) are computed before the if in uniform registers and pinned there, so the accesses use the [R.U32 + UR] and [RZ + UR] address forms instead of computing 64-bit addresses in GPRs. Part of the shader cache key."

[env.NAK_PLOP_FOLD]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. A PLOP3 that combines a comparison with one other predicate becomes the comparison's accumulator (FSETP/ISETP .AND/.OR/.XOR). Part of the shader cache key."

[env.NAK_IF_CONVERT]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. After register allocation, NAK predicates small then/else blocks (8 instructions, or 12 for a then- and an else-block together) instead of branching around them, and drops the BSSY/BSYNC pair of a region left without branches. Does not change register counts. Part of the shader cache key."

[env.NAK_NIR_FLATTEN]
class = "experiment"
read = "first shader compile (once per process)"
effect = "1 lets NIR flatten small ifs into selects (nir_opt_peephole_select limit 8). Fewer instructions, but the values of both sides are live at once, which costs occupancy on some shaders. Off by default. Part of the shader cache key."

[env.NAK_BSSY_RECONVERGENT]
class = "experiment"
read = "shader compile (once per process)"
effect = "1 (SM100 and newer) gives the BSSY/BSYNC pairs of if/else regions the .RECONVERGENT mode, as NVIDIA's own SM120 code does, without the BMOV.CLEAR before each BSSY. Barriers used by BREAK keep the plain mode. Off by default: no measurable frame-rate change in Steel Nomad. Part of the shader cache key."

[env.NAK_PHI_AVOID]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. Register allocation keeps a new value without a register preference out of the registers that the phi copies at the end of its block want for other values, which saves copies and swaps at if/else merges. Part of the shader cache key."

[env.NAK_BAR_SHARE]
class = "experiment"
read = "first shader compile (once per process)"
effect = "1: when all six scoreboards are in use, a new variable-latency instruction shares the most recently used scoreboard instead of waiting for the oldest one to finish (waiting on a shared scoreboard waits for all its instructions). Off by default until validated on hardware (naktest). Part of the shader cache key."

[env.NAK_LAT]
class = "experiment"
read = "first shader compile (once per process)"
effect = "Bitmask, default 0: SM120 register dependency pairs that wait the SM100 latency instead of one cycle more: 1 FMA-class chains, 2 FMA/ALU cross pairs, 4 predicate guards, 8 coupled carry predicates, 16 uniform datapath, 64 LOP3/PRMT/SHF chains, 128 every pair (unsafe upper bound). For hardware validation with naktest only. Part of the shader cache key."

[env.NAK_F16_CVT]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 restores F2F. On SM86+ a scalar f32-to-f16 conversion is F2FP.F16.F32.PACK_AB with a zero high half (ALU pipe, unless fp16 denormals are flushed) and an f16-to-f32 conversion is HADD2.F32 with -0 (FMA pipe), instead of F2F on the quarter-rate conversion pipe shared with MUFU. Matters for shaders with native 16-bit types (DXIL 6.2 half) that convert dozens of times per loop iteration. Part of the shader cache key."

[env.NAK_UNIFORM_ATOMICS]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. An atomic whose address is the same in every active lane of a subgroup is done once by one lane, with a subgroup reduction of the value and an exclusive scan giving each lane its result (nir_opt_uniform_atomics), instead of one atomic per lane serialized in L2. Part of the shader cache key."

[env.NAK_EARLY_EXIT]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. In compute shaders, the lanes that leave early (a trailing divergent if, or an early return that the front-end made a loop that never iterates) exit, and the rest of the shader runs in convergent control flow, where its uniform values (descriptor indices, handles, root-constant addresses) use the uniform datapath instead of per-lane GPRs. Off keeps the divergent if or the loop around the whole body. Part of the shader cache key."

[env.NAK_LOOP_CONT_SYNC]
class = "tuning"
read = "first shader compile (once per process)"
effect = "Off by default (unset or 0); 1 makes every divergent loop sync its lanes at the end of each iteration (BSSY/BSYNC around the body, breaks escape through it). Off, loops with no continue skip that sync and breaks go to the loop's exit sync directly. Part of the shader cache key."

[env.NAK_UNROLL_MAX]
class = "tuning"
read = "first shader compile (once per process)"
effect = "Most iterations NIR fully unrolls a loop with a known trip count: 0, 1, 2, 4, 8, 16, 32 (default) or 64; other values round down to one of these. Lower values keep loops rolled as NVIDIA's compiler does (smaller code, sometimes fewer registers, a few instructions of loop overhead per iteration). Part of the shader cache key."

[env.NAK_VEC_CSE]
class = "tuning"
read = "first shader compile (once per process)"
effect = "On by default (unset or 1); 0 turns it off. The register copies that turn a vector source with repeated components (an image store of vec4(x), say) into a register vector are made once per block and reused by later uses of the same vector. Part of the shader cache key."

[env.NAK_WEAK_MEM]
class = "experiment"
read = "first shader compile (once per process)"
effect = "1: global, SSBO and image loads and stores that are not coherent, volatile or atomic use the weak memory order (L1-cacheable plain LDG/STG/SULD/SUST, as NVIDIA's own code does) instead of .STRONG.GPU, which sends every load to L2. Barriers keep the needed cache write-backs and invalidations. Off by default: no measurable change in Steel Nomad, per shader or in frame rate. Part of the shader cache key."

[env.NAK_OCC_TRACE]
class = "debug"
read = "first shader compile (once per process)"
effect = "1 prints NAK_OCC_TARGET's estimate for every candidate register count of every shader to stderr (cost, memory spills, gain, rejected or not)."

[env.NVK_DIAG_NO_WFI_BARRIER]
class = "debug"
read = "first pipeline barrier recorded (once per process)"
effect = "1 (unsafe, measurement only): pipeline barriers with a source stage emit no WAIT_FOR_IDLE on the 3D or compute subchannel; cache flushes and invalidates stay (a shader data flush still idles implicitly). Gives an upper bound of what draining at barriers costs; rendering may be wrong."

[env.NVK_DIAG_WFI_COUNT]
class = "debug"
read = "first pipeline barrier recorded (once per process)"
effect = "1 logs once a second (mesa_logi, MESA_LOG_FILE on Windows) how many idles pipeline barriers recorded per second: explicit WAIT_FOR_IDLE, shader data flushes, and the ones NVK_DIAG_NO_WFI_BARRIER skipped."

[env.NVK_DISPATCH_CAPTURE]
class = "debug"
read = "device creation"
effect = "Comma-separated 16-digit source hashes (vkd3d-proton DXIL hashes, as NVK_DISPATCH_PROFILE prints them) of compute shaders to capture: one dispatch each is written with its SPIR-V, push constants, grid and the contents of every image, buffer, sampler and root buffer address it reads, for replaying it outside the game. Each capture is a directory <hash>-p<pid>-<n> with manifest.json, shader.spv, push.bin and one raw file per resource; events go to nvk-dcap.log there."

[env.NVK_DISPATCH_CAPTURE_COUNT]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: captures per listed shader."

[env.NVK_DISPATCH_CAPTURE_DELAY_S]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: seconds after device creation before matching dispatches count."

[env.NVK_DISPATCH_CAPTURE_DIR]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: directory the captures are written to."
default_note = "unset: %ProgramData%\\Helios\\dcap on Windows, /tmp/nvk-dcap elsewhere"

[env.NVK_DISPATCH_CAPTURE_MAX_MB]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: largest staging buffer one capture may allocate, in MiB; a dispatch needing more is not captured (logged)."

[env.NVK_DISPATCH_CAPTURE_POST]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: 1 also copies every resource the shader may write after the dispatch (r<N>.post.bin), NVK's result to compare a replay with."

[env.NVK_DISPATCH_CAPTURE_SKIP]
class = "debug"
read = "device creation"
effect = "With NVK_DISPATCH_CAPTURE: matching dispatches of each shader skipped once armed before the first capture."

[env.NVK_DISPATCH_CAPTURE_TRIGGER]
class = "debug"
read = "device creation; the file is checked at most every 250 ms"
effect = "With NVK_DISPATCH_CAPTURE: path of a file whose creation arms the capture (after the delay), to pick the moment in a running game; unset: armed by the delay alone."

[env.NVK_DISPATCH_PROFILE]
class = "debug"
read = "device creation"
effect = "1: GPU time of every dispatch (direct, indirect with its arguments read back, device-generated as a whole, the driver's own), per compute shader: its vkd3d-proton DXIL hash (the VKD3D_SHADER_DUMP_PATH file name; else a hash of the SPIR-V), NVK_SHADER_STATS code hash and workgroup size. Every 2 s a table of GPU ms/s, share, calls/s, mean/median/max us per call, GPRs, warps, grids, written to the NVK_PASS_PROFILE file (NVK_PASS_PROFILE_FILE). Works alone or with NVK_PASS_PROFILE and on the async compute queue. Each dispatch waits for idle before and after it, so frames get slower: for attribution, not frame time."

[env.NVK_BLACKWELL_MME_MEMBAR]
class = "debug"
read = "device creation"
effect = "1 adds a memory barrier to the MME macros on Blackwell; 0 relies on the host wait-for-idle only (A/B switch)."

[env.NVK_CPU_STATE_TRACKING]
class = "debug"
read = "once per process"
effect = "1 skips 3D state methods whose value the GPU already has (Conduit's per-draw cost patches); 0 emits them as upstream NVK does, for bisecting."

[env.NVK_DRAW_SYSVAL_SKIP]
class = "experiment"
read = "device creation"
effect = "1 (Turing and later) writes draw parameters into the root table only for the system values the bound shaders read; 0 writes all of them."

[env.NVK_EXPERIMENTAL]
class = "supported"
read = "instance creation"
effect = "Upstream NVK's list of experimental features; video makes NVK expose Vulkan Video decode. The ICD bridge sets it to video for NVK processes unless the registry VideoDdi is 0."

[env.NVK_FS_STATE_TRACKING]
class = "debug"
read = "device creation"
effect = "1 emits the fragment shader state tail only when it differs from what was last emitted; 0 always emits it, for bisecting."

[env.NVK_HELIOS_DRI]
class = "debug"
read = "device creation"
effect = "Index of the host render node the zero-copy Win32 present and dma-buf paths use."

[env.NVK_HELIOS_FORMATS]
class = "debug"
read = "device creation"
effect = "1 uses the KMD's layout service so every shared format gets a Helios resource id; 0 turns that off (shared images fall back to the formats without it)."

[env.NVK_HELIOS_MODIFIERS]
class = "debug"
read = "device creation"
effect = "1 exposes VK_EXT_image_drm_format_modifier on Windows when the KMD serves the modifier layout; 0 hides the extension there."

[env.NVK_HELIOS_RESID]
class = "debug"
read = "device creation"
effect = "1 gives NVK images Helios resource ids through the KMD's RM import, so the D3D UMDs and DWM can share them; 0 turns that off."

[env.NVK_HELIOS_SHARED_IMPORT]
class = "debug"
read = "device creation"
effect = "1 lets NVK open another NVK process's shared surface by its Helios resource id; 0 turns that import off."

[env.NVK_HELIOS_WSI]
class = "debug"
read = "device creation"
effect = "1 enables the zero-copy Win32 present through the Helios scanout; 0 turns it off and the Win32 WSI copies through GDI."

[env.NVK_HELIOS_WSI_COMPOSE]
class = "supported"
read = "device creation"
effect = "1 makes window swap chains present through a D3D11 flip swap chain on the Helios adapter, so DWM composes them; 0 uses scanout or GDI presents instead."
default_note = "on while DWM composes the desktop on NVK, else off"

[env.NVK_HELIOS_WSI_LINEAR]
class = "experiment"
read = "swapchain creation"
effect = "1 makes Win32 scanout swap chains linear (NVK renders through a tiled shadow); 0 keeps block-linear scanout images."

[env.NVK_HELIOS_WSI_SCANOUT]
class = "debug"
read = "device creation"
effect = "1 allows scanout swap chains even while DWM on NVK composes the desktop; 0 (with DWM on NVK) uses composed presents only."

[env.NVK_INDIRECT_PUSH]
class = "experiment"
read = "device creation"
effect = "1 (Turing and later) pushes indirect draw records inline through the pushbuffer MME path; 0 uses the standard indirect path."

[env.NVK_MDI_BATCH]
class = "experiment"
read = "device creation"
effect = "N > 0 (Turing and later) reads indirect multi-draw records in batches of N through one MME DMA read; 0 is off."

[env.NVK_MME_PACK_INSTR]
class = "experiment"
read = "device creation"
effect = "1 packs MME macro instructions to save macro RAM (test only); 0 uploads them unpacked."

[env.NVK_NULL_VB_ZERO_PAGE]
class = "tuning"
read = "device creation"
effect = "1 binds a null vertex buffer to the zero page so reads return zero; 0 is the upstream behaviour."

[env.NVK_PASS_DUMP]
class = "debug"
read = "once per process"
effect = "With NVK_PASS_PROFILE=5: selects the render pass whose draws are dumped, by a description of its attachments (sample count, layers, formats)."
default_note = "unset: a built-in pass description (2x MSAA, D24S8 depth)"

[env.NVK_PASS_DUMP_DELAY_S]
class = "debug"
read = "once per process"
effect = "With NVK_PASS_PROFILE=5: seconds after start before the pass dump is taken."

[env.NVK_PASS_DUMP_FILE]
class = "debug"
read = "once per process"
effect = "Path of the NVK_PASS_PROFILE=5 dump file; unset uses a default file under the Helios log directory."

[env.NVK_PASS_PROFILE]
class = "debug"
read = "device creation"
effect = "GPU time per render pass and command buffer: 0 off, 1 timings, higher levels add work outside passes, ZCULL counters (3), method histograms (4) and a single-pass draw dump (5)."

[env.NVK_PASS_PROFILE_FILE]
class = "debug"
read = "device creation"
effect = "Full path the NVK_PASS_PROFILE and NVK_DISPATCH_PROFILE lines are written to; unset uses a default file under the Helios log directory on Windows."

[env.NVK_RM]
class = "supported"
read = "physical device enumeration"
effect = "Whether NVK enumerates the RM-backed GPU. On Windows it is on unless set to 0 or the Helios process policy sends the process to Venus; the ICD bridge sets NVK_RM=1 for processes it puts on NVK."
default_note = "on on Windows (Helios build); off in the Linux build, where it must be set"

[env.NVK_RMCLIENT_LIB]
class = "debug"
read = "physical device enumeration"
effect = "Path of the librmclient library NVK loads; unset uses the library next to the driver."

[env.NVK_RM_ASYNC_COMPUTE]
class = "tuning"
read = "physical device enumeration"
effect = "1 exposes a compute + transfer queue family (4 queues) whose channels sit in the first graphics queue's channel group on VEIDs of their own, so D3D12 compute and copy queues (vkd3d-proton) run next to the graphics queue instead of behind it; 0 keeps one queue family."
default_note = "on on Blackwell GB20x (compute class 0xcec0 and newer), off on older GPUs"
see = "[guest/nvk-rm/README.md](../guest/nvk-rm/README.md)"

[env.NVK_RM_ASYNC_WAIT_SWITCH]
class = "experiment"
read = "first GPU wait"
effect = "1 makes every GPU wait that blocks ask for a channel group switch, also a wait for a value another channel of the same group signals; 0 skips the switch for those."

[env.NVK_RM_BAR_MB]
class = "experiment"
read = "physical device enumeration"
effect = "Size in MiB of the device-local host-visible memory type (the BAR heap). 0 hides that heap; a positive value reports a heap of that size."

[env.NVK_RM_COMPRESSION]
class = "debug"
read = "device creation"
effect = "1 allows compressible VRAM for images on Blackwell (GB20x); 0 turns compression off."

[env.NVK_RM_COMPRESS_ALL]
class = "tuning"
read = "physical device creation"
effect = "1 makes every device-local allocation an image may be bound to compressible; 0 compresses only dedicated image memory. Unset, it is on for vkd3d-proton (D3D12) processes and off for all others (D3D11 through DXVK, native Vulkan, the desktop compositor), and stays off when compression is off or NVK_RM_COMPRESS_TYPE is on."
default_note = "unset means on in a process whose Vulkan engine name starts with vkd3d (vkd3d-proton), off in every other"

[env.NVK_RM_COMPRESS_CLEAR]
class = "debug"
read = "per memory allocation"
effect = "Nonzero clears compressible memory once through its compressible address at allocation, so no page keeps an earlier owner's compression state."

[env.NVK_RM_COMPRESS_TYPE]
class = "experiment"
read = "device creation"
effect = "1 adds a compressible device-local memory type that optimal-tiling images may use; 0 does not offer it."

[env.NVK_RM_COMPRESS_TYPE_SCOPE]
class = "debug"
read = "per image memory requirements query"
effect = "attachments offers the compressible memory type only to images that are compressed themselves (a diagnostic that departs from the spec); unset offers it to all optimal-tiling images."

[env.NVK_RM_COMPRESS_ZS]
class = "tuning"
read = "device creation"
effect = "1 compresses separate depth and stencil images (Blackwell's D24S8 and D32S8X24 planes); 0 leaves them uncompressed."

[env.NVK_RM_CPU_KICK]
class = "tuning"
read = "once per process"
effect = "1 lets a CPU wait be woken without a host round trip per wake; 0 goes back to a host round trip for every wake."

[env.NVK_RM_DEFER_FREE]
class = "tuning"
read = "device creation"
effect = "1 frees memory objects and GPU virtual addresses only after the GPU work that used them has finished, without blocking the freeing thread; 0 frees immediately after a wait."
default_note = "on on Windows, off elsewhere"

[env.NVK_RM_DEFER_FREE_MB]
class = "tuning"
read = "device creation"
effect = "With deferred frees: MiB of pending frees above which the freeing thread waits for the GPU."

[env.NVK_RM_DESC_TABLE_VRAM]
class = "experiment"
read = "device creation"
effect = "1 places descriptor tables in host-visible VRAM written through BAR1; 0 keeps them in GPU-cacheable system memory."

[env.NVK_RM_DMABUF]
class = "debug"
read = "physical device enumeration"
effect = "1 looks for the host render node so memory can be exported and imported as dma-bufs; 0 skips that and leaves dma-buf sharing off."

[env.NVK_RM_EVENT_DRAIN]
class = "debug"
read = "once per process"
effect = "1 reads the RM event's data after every wake; 0 drains it only when needed."

[env.NVK_RM_EVENT_GEN]
class = "tuning"
read = "device creation"
effect = "1 makes CPU waits wait on librmclient's wake generations when librmclient provides them; 0 polls the event instead."

[env.NVK_RM_FENCE]
class = "supported"
read = "device creation"
effect = "1 lets presents retire on RM fences with no CPU wait; 0 makes NVK wait on the CPU before every flip."

[env.NVK_RM_FENCE_KMD]
class = "debug"
read = "device creation"
effect = "1 hands present fences to the KMD so it flips on them; 0 keeps them in NVK and the flip thread waits."

[env.NVK_RM_GPFIFO_ENTRIES]
class = "debug"
read = "exec context creation"
effect = "Number of GPFIFO ring entries per channel (a power of two, 64 to 4096); smaller values undo the large ring for A/B."
default_note = "4096 (NVKMD_RM_GPFIFO_ENTRIES)"

[env.NVK_RM_HIRES_SLEEP]
class = "debug"
read = "device creation"
effect = "1 uses high-resolution sleeps in CPU waits; 0 uses Sleep(1), which rounds up to the system timer tick."

[env.NVK_RM_HUGE_PAGES]
class = "experiment"
read = "device creation"
effect = "1 uses 2 MiB GPU pages for VRAM allocations of 2 MiB or more that the CPU never maps; 0 uses 64 KiB pages."

[env.NVK_RM_INTERLEAVE]
class = "experiment"
read = "exec context creation"
effect = "0, 1 or 2 sets the interleave level (low, medium, high) of the context's channel group on the graphics runlist; -1 leaves RM's default."

[env.NVK_RM_RING_YIELD_MS]
class = "debug"
read = "once per process"
effect = "Milliseconds a submission waiting for ring space yields before it blocks; 0 blocks at once."
default_note = "4"

[env.NVK_RM_SYSMEM_CACHED]
class = "tuning"
read = "device creation"
effect = "1 maps coherent host-visible system memory GPU-cacheable; 0 leaves it uncached; desc or app limits caching to descriptor memory or to application memory (A/B split)."
default_note = "1 (on)"

[env.NVK_RM_SYSMEM_SLABS]
class = "tuning"
read = "device creation"
effect = "1 lets small system-memory allocations share pinned slabs; 0 gives each its own allocation."

[env.NVK_RM_TIMESLICE_US]
class = "experiment"
read = "exec context creation"
effect = "Timeslice in microseconds of the context's channel group on the graphics runlist; 0 leaves RM's default."

[env.NVK_RM_UPLOAD_VRAM]
class = "tuning"
read = "device creation"
effect = "Which command buffer upload memory lives in CPU-mapped VRAM written through BAR1 instead of system memory. compute (the default on Windows): the compute root descriptor tables, which every dispatch waits for (tiny dispatches cost 0.48 us each from VRAM against 2.5-3.7 us from system memory on an RTX 5090); 1: all upload memory; 0: none."
default_note = "compute on Windows, 0 elsewhere"

[env.NVK_RM_VIDEO]
class = "debug"
read = "physical device enumeration"
effect = "1 reports video decode on an NVDEC channel when the GPU has one (still exposed only with NVK_EXPERIMENTAL=video); 0 hides it."

[env.NVK_RM_WAIT_POLL_MS]
class = "tuning"
read = "once per process"
effect = "Longest single block, in milliseconds, of a CPU wait on the RM event before it checks the value again."
default_note = "1 on Windows, 10 elsewhere (NVKMD_RM_WAIT_POLL_MS_DEFAULT)"

[env.NVK_RM_WAIT_SPIN]
class = "tuning"
read = "once per process"
effect = "Yield iterations a CPU wait spins before it blocks on the RM event."
default_note = "64 (NVKMD_RM_WAIT_SPIN_ITERS_DEFAULT)"

[env.NVK_RM_WAIT_SPIN_US]
class = "experiment"
read = "once per process"
effect = "Microseconds a CPU wait polls the value before it blocks (at most 2000); 0 does not poll."

[env.NVK_RM_ZCULL]
class = "debug"
read = "physical device enumeration"
effect = "1 queries the ZCULL parameters from RM so NVK uses ZCULL for depth images; 0 turns ZCULL off."

[env.NVK_SCANOUT_RELEASE]
class = "debug"
read = "device creation"
effect = "1 tracks when the host releases a scanout image so it comes back to the swap chain only then; 0 turns that tracking off."

[env.NVK_SHADER_STATS]
class = "debug"
read = "device creation"
effect = "1 logs one line per shader uploaded (compiled or loaded from the cache) with NAK's statistics."

[env.NVK_SHADER_STATS_FILE]
class = "debug"
read = "device creation"
effect = "Path of the NVK_SHADER_STATS log; unset uses a default file under the Helios log directory on Windows."

[env.NVK_SKIP_DRAWID]
class = "experiment"
read = "device creation"
effect = "1 skips writing the draw index for indirect draws (test only; wrong for shaders that read it); 0 writes it."

[env.NVK_UBO_DESC_CBUF]
class = "tuning"
read = "physical device creation"
effect = "1 promotes uniform buffer descriptors to bound constant buffers as upstream NVK does; 0 keeps them as descriptors."
default_note = "0 on Windows, 1 elsewhere"

[env.NVK_VM_LOG]
class = "debug"
read = "device creation"
effect = "Path of the NVK_DEBUG=vm log (GPU VA allocation, free, bind and unbind); unset uses a default file on Windows."

[env.NVK_WAIT_STATS]
class = "debug"
read = "once per process"
effect = "1 records per wait site how many CPU waits there were and how long they took, written at exit."

[env.NVK_WAIT_STATS_FILE]
class = "debug"
read = "once per process"
effect = "Path of the NVK_WAIT_STATS output; unset uses a default file under the Helios log directory on Windows."

[env.NVK_ZERO_PAGE_VRAM]
class = "tuning"
read = "device creation"
effect = "1 places the zero page that null descriptors and buffers read in VRAM; 0 keeps it in system memory."

[env.ZINK_VULKAN_ICD]
class = "debug"
read = "once per process"
effect = "The Vulkan ICD Zink loads on Windows: a DLL path, or loader for the Vulkan loader; unset loads NVK from next to the driver or the Helios install directory."

[env.NVK_RM_COMPRESS_UPGRADE]
class = "debug"
read = "first compressible VA bind (once per process)"
effect = "0 keeps images that are bound to compressible memory without being compressed themselves on the uncompressed kind on their own VA; 1 gives them the compressible kind."
see = "[README](../guest/nvk-rm/README.md)"

[umd.Umd12EngineShaderCaps]
class = "experiment"
read = "once per process"
effect = "1 reports vkd3d-proton's own shader answers instead of the fixed table: shader models up to the engine's highest (6.4 to 6.8), MinPrecision 16-bit and Native16BitOps when the engine reports them. 0 or absent: the fixed table, which stops at 6.3."

[env.HELIOS_VKD3D_PUSH_CBV]
class = "experiment"
read = "device creation"
effect = "1 keeps D3D12 root CBVs as Vulkan push descriptors on NVIDIA hardware even with EXT device-generated commands, as upstream vkd3d-proton does. Unset or 0: the raw-address root CBV ABI."

[env.NVK_CMD_MEM_CACHE]
class = "supported"
read = "device creation"
effect = "How many command-buffer memory blocks of each kind a device keeps when a command pool is destroyed or trimmed, for new pools to reuse (default 64, at most 4096). 0 frees them as before."
