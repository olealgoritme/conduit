[env.VKD3D_LOG_FILE]
class = "debug"
read = "first D3D12 device creation"
effect = "vkd3d-proton's log file. When unset, the D3D12 bridge sets it to C:\\ProgramData\\Helios\\umd12-<pid>-vkd3d.log; a value already set is kept."
