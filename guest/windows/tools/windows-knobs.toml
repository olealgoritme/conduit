effect = "vkd3d-proton's shader cache folder. When unset, the D3D12 bridge sets it to %LOCALAPPDATA%\\Helios\\vkd3d, else the temp folder, else 0 (no disk cache); a value already set, 0 included, is kept."
default_note = "unset: the bridge sets it per process"

[env.MESA_WSI_COMPOSE_ADAPTER]
class = "debug"
read = "swapchain creation"
effect = "Index of the DXGI adapter the Win32 WSI's composed present uses for its D3D11 flip swap chain. -1 picks the first Helios adapter."

[env.MESA_WSI_COMPOSE_THREAD]
class = "tuning"
