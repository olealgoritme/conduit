[package]
name = "conduit-shell-menu"
version = "0.1.0"
edition = "2021"
description = "Explorer's \"Send to Conduit host\" command (Windows 11 context menu)"
license = "Apache-2.0"
publish = false

# An in-process COM server (IExplorerCommand) that Explorer loads through the
# sparse package in package/ (AppxManifest.xml); see New-ShellMenuPackage.ps1.
[lib]
name = "conduit_shell_menu"
path = "src/lib.rs"
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# The implement macro expands to windows_core paths.
windows-core = "0.58"

[workspace]

[profile.release]
# Unwind, so a panic in a COM method is caught (lib.rs `guard`) and returned
# as E_UNEXPECTED instead of tearing down the process that loaded the DLL.
panic = "unwind"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
