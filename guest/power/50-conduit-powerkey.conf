# Conduit: the VM's power button (ACPI, sent by `conduit down`, virt-manager
# "Shut Down", `virsh shutdown`) powers the VM off cleanly.
# GNOME takes the power key over with an inhibitor lock and then shows a
# dialog or does nothing, so a VM with a desktop never turned off.
# PowerKeyIgnoreInhibited makes logind act on the key anyway.
[Login]
HandlePowerKey=poweroff
PowerKeyIgnoreInhibited=yes
