# Conduit's guest GPU driver was called virtio_gpu_nv before it was renamed
# to conduit_gpu. An old virtio_gpu_nv.ko left behind (a module built by hand,
# a kernel that still carries it) must never load next to the new one: both
# bind the same virtio device and create the same /dev/nvidia* nodes.
# Anything that still asks for the old name gets conduit_gpu instead.
blacklist virtio_gpu_nv
install virtio_gpu_nv /sbin/modprobe conduit_gpu

# Virtio device ID 45 is Conduit's GPU here, but the virtio spec has since
# assigned 45 to SPI controllers, and kernels with spi_virtio (Arch 7.2) race
# conduit_gpu for the device. When spi_virtio wins, the guest has no GPU (and
# unbinding it oopses in virtio_dev_remove). Conduit VMs have no virtio SPI.
blacklist spi_virtio
