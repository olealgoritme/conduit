# Conduit: allow unprivileged user namespaces inside the VM.
#
# Ubuntu 24.04 restricts them through AppArmor by default, and Steam
# (pressure-vessel, its container runtime) then refuses to start ("Steam now
# requires user namespaces to be enabled"). Flatpak and the Chromium/Firefox
# sandboxes need them as well. The setting only exists on kernels with
# Ubuntu's AppArmor patches; elsewhere the leading "-" makes
# sysctl skip it quietly.
-kernel.apparmor_restrict_unprivileged_userns = 0
