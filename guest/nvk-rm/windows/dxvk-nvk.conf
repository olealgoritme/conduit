# DXVK config for the application-local DXVK -> NVK-on-RM drop-in
# (stage-dxvk-app.sh). DXVK reads dxvk.conf from the working directory.

# The Helios fork defaults this to True for Venus (see d3d11_options.cpp);
# upstream's default is False, which is what NVK should get. Harmless on an
# upstream build.
d3d11.disableDirectImageMapping = False
