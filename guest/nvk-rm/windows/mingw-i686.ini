# Meson cross file: Windows x86 (32-bit) with MinGW-w64 (Ubuntu's gcc-mingw-w64)
# and Rust's i686-pc-windows-gnu target.
[binaries]
c = 'i686-w64-mingw32-gcc'
cpp = 'i686-w64-mingw32-g++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
rust = ['rustc', '--target', 'i686-pc-windows-gnu']
pkg-config = 'pkg-config'

[properties]
# bindgen runs libclang on the host; tell it which target the headers are for.
bindgen_clang_arguments = ['--target=i686-w64-mingw32', '-mno-ms-bitfields']

[built-in options]
# GCC (Itanium) bitfield layout instead of MinGW's default MSVC layout:
# bindgen only models the GCC layout, and NAK/NIR share structs with mixed
# bitfield types between C and Rust (NAK also asserts their sizes, e.g.
# nak_nir_tex_flags == 4 bytes).  Nothing crossing the DLL boundary has
# mixed-type bitfields (Vulkan API, RM parameter structs).
c_args = ['-mno-ms-bitfields']
cpp_args = ['-mno-ms-bitfields']
# Self-contained DLLs: no libgcc / libstdc++ DLLs next to them.
c_link_args = ['-static-libgcc']
cpp_link_args = ['-static-libgcc', '-static-libstdc++']

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
